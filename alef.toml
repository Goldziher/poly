# Components-only alef config: no binding languages, so `alef generate` emits the component producer
# crates and the standalone Rust host module and nothing else. Regenerate with `mise run components:generate`.

[workspace]

[[crates]]
name = "poly-engines"
sources = ["crates/poly-engines/src/lib.rs"]
version_from = "Cargo.toml"
# The facade also exports Producer and engine-facing types the contract never uses; only the
# PolyComponent trait is extracted into a component contract.
suppress_validation_codes = ["lossy_sanitized_surface", "backend_stub_path"]

[[crates.component_contracts]]
name = "poly"
trait_path = "poly_engines::PolyComponent"
interface_version = 1

# The frontend contract: a component that hosts no engines and serves a client over the process's
# stdio, doing its work through the host-service table (alef 0.118 `AlefHostApiV1::service_call`).
[[crates.component_contracts]]
name = "poly_frontend"
trait_path = "poly_engines::PolyFrontend"
interface_version = 1

[[crates.components]]
name = "sql"
provides = [{ contract = "poly", implementation = "poly_engines::SqlComponent" }]
features = ["sql"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The python family: ruff, and ty for project type checking.
[[crates.components]]
name = "python"
provides = [{ contract = "poly", implementation = "poly_engines::PythonComponent" }]
features = ["python"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The php family: mago.
[[crates.components]]
name = "php"
provides = [{ contract = "poly", implementation = "poly_engines::PhpComponent" }]
features = ["php"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The nix family: alejandra.
[[crates.components]]
name = "nix"
provides = [{ contract = "poly", implementation = "poly_engines::NixComponent" }]
features = ["nix"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The typos family: the typos spell-checker, opt-in.
[[crates.components]]
name = "typos"
provides = [{ contract = "poly", implementation = "poly_engines::TyposComponent" }]
features = ["typos"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The astgrep family: ast-grep and its built-in rule pack.
[[crates.components]]
name = "astgrep"
provides = [{ contract = "poly", implementation = "poly_engines::AstgrepComponent" }]
features = ["astgrep"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The uncomment family: the opt-in comment-removal lint. Its own component, not part of misc: it is
# cross-cutting (every language) and off by default, so only projects that enable it download it.
[[crates.components]]
name = "uncomment"
provides = [{ contract = "poly", implementation = "poly_engines::UncommentComponent" }]
features = ["uncomment"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The misc family: Dockerfile, dotenv, GraphQL, HCL and INI.
[[crates.components]]
name = "misc"
provides = [{ contract = "poly", implementation = "poly_engines::MiscComponent" }]
features = ["misc"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# rubyfmt is a git-pinned dependency, so its family crate lives in the separate `components/`
# workspace; alef generates and builds the producer there.
[[crates.components]]
name = "ruby"
provides = [{ contract = "poly", implementation = "poly_engines_ruby::RubyComponent" }]
source_manifest = "components/crates/poly-engines-ruby/Cargo.toml"
producer_dir = "components/crates/poly-engines-ruby-component"
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# biome is a git-pinned dependency, so its family crate lives in the separate `components/`
# workspace; alef generates and builds the producer there.
[[crates.components]]
name = "biome"
provides = [{ contract = "poly", implementation = "poly_engines_biome::BiomeComponent" }]
source_manifest = "components/crates/poly-engines-biome/Cargo.toml"
producer_dir = "components/crates/poly-engines-biome-component"
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The web family (oxc, taplo, markup_fmt, malva, rumdl, adrlint, yaml) depends on the git-pinned oxc
# crates, so its family crate also lives in `components/`; alef generates and builds the producer there
# (`alef generate` creates `components/crates/poly-engines-web-component`).
[[crates.components]]
name = "web"
provides = [{ contract = "poly", implementation = "poly_engines_web::WebComponent" }]
source_manifest = "components/crates/poly-engines-web/Cargo.toml"
producer_dir = "components/crates/poly-engines-web-component"
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# pyrefly is a git-pinned dependency whose library crate links tikv-jemallocator 0.7, which cannot share a
# lockfile with the rumdl in `components/` (one `links = "jemalloc"` crate per lockfile), so its family crate
# lives in the separate `components-pyrefly/` workspace; alef generates and builds the producer there.
[[crates.components]]
name = "pyrefly"
provides = [{ contract = "poly", implementation = "poly_engines_pyrefly::PyreflyComponent" }]
source_manifest = "components-pyrefly/crates/poly-engines-pyrefly/Cargo.toml"
producer_dir = "components-pyrefly/crates/poly-engines-pyrefly-component"
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The MCP server as a frontend component: poly-mcp (rmcp, tokio) lives here instead of in the core
# binary. It reaches the engines through the host services `poly mcp` registers.
[[crates.components]]
name = "mcp"
provides = [{ contract = "poly_frontend", implementation = "poly_engines::McpComponent" }]
features = ["mcp"]
default_features = false
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# The sh sidecar: shfmt (mvdan.cc/sh) as a pure-Go executable speaking alef's framed stdio protocol
# (ADR 0045). alef plans, builds, packages and locks it with the Rust components; the build is the
# Go cross-compile in mise-tasks/sidecar/build.sh and writes exactly {out}.
[[crates.components]]
name = "sh"
producer_language = "executable"
producer_dir = "components/sidecars/sh"
provides = [{ contract = "poly", implementation = "NewShComponent" }]
features = []
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
executable = { build = "../../../mise-tasks/sidecar/build.sh sh {target} {out}", toolchain_version_cmd = "go version", inputs = [
  "components/sidecars/sh",
  "mise-tasks/sidecar/build.sh",
  "crates/poly-component-protocol",
  "schemas/component-protocol.json",
] }

# Release distribution: component archives are GitHub release assets of the tag they were built for
# ({version} is the version the artifact was packaged at, so an asset reused from an earlier release
# keeps pointing at that release). The signing key is the repository secret POLY_COMPONENT_SIGNING_KEY
# (publish.yaml); this is its public half, the only key the embedded lock trusts.
# `components:dev` passes its own file:// URL template and --unsigned, so it is unaffected.
[crates.component_distribution]
url_template = "https://github.com/Goldziher/poly/releases/download/v{version}/{artifact}"
artifact_name_template = "poly-component-{component}-{version}-{target}-{fh16}-{ch16}.tar.gz"

[crates.component_distribution.public_keys]
poly-release-1 = "MCowBQYDK2VwAyEAmv5BXWnmk2dddU9Uv74gMjlYP5urPfJVFbm3thZB/xk="

[crates.component_host]
output = "crates/poly-component-host/src/components_gen.rs"
