baseline = "v1.13.0"

# The component crates alef-component-abi/runtime are pinned at =0.127.2 in Cargo.toml, and the CLI
# that builds and locks components must match that ABI; the baseline still carries 0.116.0.
[overrides."github:xberg-io/alef"]
version = "0.127.2"
reason = "must match the alef-component-abi/runtime =0.127.2 crates the component ABI is built on"
