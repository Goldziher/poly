[workspace]
exclude = ["components"]
resolver = "3"
members = [
  "crates/conformance",
  "crates/dockerfile-parser",
  "crates/poly-buildinfo",
  "crates/poly-cache",
  "crates/poly-catalog",
  "crates/poly-cli",
  "crates/poly-component-host",
  "crates/poly-component-index",
  "crates/poly-component-protocol",
  "crates/poly-config",
  "crates/poly-core",
  "crates/poly-engine-api",
  "crates/poly-engines",
  "crates/poly-engines-astgrep",
  "crates/poly-engines-astgrep-component",
  "crates/poly-engines-mcp-component",
  "crates/poly-engines-misc",
  "crates/poly-engines-misc-component",
  "crates/poly-engines-nix",
  "crates/poly-engines-nix-component",
  "crates/poly-engines-php",
  "crates/poly-engines-php-component",
  "crates/poly-engines-python",
  "crates/poly-engines-python-component",
  "crates/poly-engines-sql",
  "crates/poly-engines-sql-component",
  "crates/poly-engines-typos",
  "crates/poly-engines-typos-component",
  "crates/poly-engines-uncomment",
  "crates/poly-engines-uncomment-component",
  "crates/poly-frontend-api",
  "crates/poly-grammar",
  "crates/poly-hooks",
  "crates/poly-host-services",
  "crates/poly-mcp",
  "crates/poly-workspace",
]

[workspace.package]
version = "0.33.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
repository = "https://github.com/Goldziher/poly"
homepage = "https://github.com/Goldziher/poly"
documentation = "https://github.com/Goldziher/poly"

[workspace.dependencies]
aho-corasick = "1.1.5"
alef-component-abi = "=0.127.2"
alef-component-runtime = "=0.127.2"
# alejandra — Nix formatter (UNLICENSE, pure Rust via rnix); chosen over
alejandra = "3.1"
annotate-snippets = "0.12.17"
anstream = "1.0.0"
anstyle-query = "1.1.5"
anyhow = "1"
assert_cmd = "2"
assert_fs = "1.1.4"
ast-grep-config = "0.51.1"
ast-grep-core = "0.51.1"
axoupdater = { version = "0.10.3", default-features = false, features = ["github_releases"] }
blake3 = "1"
bstr = "1.13.1"
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
console = { version = "0.16", default-features = false, features = ["ansi-parsing", "std"] }
criterion = "0.8"
ctrlc = "3.5.2"
dockerfile-parser = { path = "crates/dockerfile-parser" }
dotenv-analyzer = "0.1"
dotenv-core = "0.1"
dunce = "1.0.5"
enquote = "1.1.0"
etcetera = "0.11.0"
fancy-regex = "0.20.0"
flate2 = "1.1"
fs-err = "3.3.2"
fs2 = "0.4"
gitfluff = { version = "0.11.0", default-features = false }
globset = "0.4.21"
graphql-parser = "0.4"
hcl-edit = "0.10.0"
hex = "0.4.3"
http = "1.5.0"
ignore = "0.4"
indicatif = "0.18.6"
indoc = "2.0.8"
insta = "1"
insta-cmd = "0.7.0"
itertools = "0.15.0"
json5 = "1.3.7"
libc = "0.2.191"
liblzma = { version = "0.4.9", features = ["static"] }
mago-allocator = { version = "1.59" }
mago-database = { version = "1.59" }
mago-formatter = { version = "1.59", features = ["serde"] }
mago-linter = { version = "1.59" }
mago-names = { version = "1.59" }
mago-php-version = { version = "1.59" }
mago-reporting = { version = "1.59" }
mago-span = { version = "1.59" }
mago-syntax = { version = "1.59" }
mago-text-edit = { version = "1.59" }
markdown = "1.0.0"
memchr = "2.8.3"
owo-colors = { version = "4", features = ["supports-colors"] }
pest = "2.9.5"
pest_derive = "2.9.5"
phf = { version = "0.14.0", default-features = false, features = ["macros"] }
poly-buildinfo = { path = "crates/poly-buildinfo" }
poly-cache = { path = "crates/poly-cache" }
poly-catalog = { path = "crates/poly-catalog" }
poly-cli = { path = "crates/poly-cli" }
poly-component-host = { path = "crates/poly-component-host" }
poly-component-index = { path = "crates/poly-component-index" }
poly-component-protocol = { path = "crates/poly-component-protocol" }
poly-config = { path = "crates/poly-config" }
# `default-features = false`: members opt into engine families explicitly (`all-engines`, `engine-*`).
poly-core = { path = "crates/poly-core", default-features = false }
poly-engine-api = { path = "crates/poly-engine-api" }
poly-engines = { path = "crates/poly-engines" }
poly-engines-astgrep = { path = "crates/poly-engines-astgrep" }
poly-engines-misc = { path = "crates/poly-engines-misc", default-features = false }
poly-engines-nix = { path = "crates/poly-engines-nix" }
poly-engines-php = { path = "crates/poly-engines-php" }
poly-engines-python = { path = "crates/poly-engines-python" }
poly-engines-sql = { path = "crates/poly-engines-sql" }
poly-engines-typos = { path = "crates/poly-engines-typos" }
poly-engines-uncomment = { path = "crates/poly-engines-uncomment" }
poly-frontend-api = { path = "crates/poly-frontend-api" }
poly-grammar = { path = "crates/poly-grammar" }
poly-hooks = { path = "crates/poly-hooks" }
poly-host-services = { path = "crates/poly-host-services", default-features = false }
poly-mcp = { path = "crates/poly-mcp" }
poly-workspace = { path = "crates/poly-workspace" }
pprof = "0.15.0"
predicates = "3"
pretty_assertions = "1.4.1"
pretty_graphql = "0.2.3"
proptest = "1.12.0"
quick-xml = "0.42"
rand = "0.10.3"
rayon = "1"
regex = "1"
rmcp = { version = "3.9.0", features = ["schemars"] }
rmp-serde = "1.3"
ruff_db = "=0.0.21"
ruff_formatter = "=0.0.21"
ruff_linter = "=0.17.4"
ruff_notebook = "=0.0.21"
ruff_python_ast = "=0.0.21"
ruff_python_formatter = "=0.0.21"
ruff_python_semantic = "=0.0.21"
ruff_text_size = "=0.0.21"
rust-ini = { version = "0.21", features = ["inline-comment"] }
rustc-hash = "2.1.3"
rustix = { version = "1.1.6", features = ["pty", "process", "fs", "termios"] }
salsa = { version = "=0.28.5", default-features = false, features = ["macros", "salsa_unstable", "inventory"] }
same-file = "1.0.6"
schemars = "1.2.3"
seahash = "4.1.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
serde_ignored = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_stacker = "0.1.14"
serde_toon_format = "0.2"
sha2 = "0.11"
shlex = "2.0.1"
similar = "3.2.1"
sqruff-lib = "0.44"
sqruff-lib-core = "0.44"
strum = { version = "0.28.0", features = ["derive"] }
tar = { version = "0.4", default-features = false }
target-lexicon = "0.13.5"
tempfile = "3"
terminal_size = "0.4.4"
textwrap = "0.16.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.2"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tree-sitter = "0.27"
tree-sitter-language-pack = "1.24"
ty_module_resolver = "=0.0.21"
# `testing` only exposes `TestProgramDb` (a salsa-cached `Program` from settings, no extra deps); poly-engines-python's
# ty database is built on it because `ty_project` is unpublished.
ty_python_core = { version = "=0.0.21", features = ["testing"] }
ty_python_semantic = "=0.0.21"
ty_site_packages = "=0.0.21"
ty_vendored = "=0.0.21"
typos = "0.10"
typos-dict = "0.14"
uncomment = "3.10"
unicase = "2"
unicode-width = { version = "0.2.3", default-features = false }
ureq = "3"
walkdir = "2.5.0"
which = "8.0.6"
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The released core binary (ADR 0039, ADR 0043): fat LTO and one codegen unit for size, stripped.
# panic stays unwind because engine_guard catches an engine panic.
[profile.core]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
