version: "3"

vars:
  POLY: cargo run -q -p poly-cli --bin poly --

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Fetch dependencies and install the git hooks
    cmds:
      - cargo fetch
      - "{{.POLY}} hooks install"

  build:
    desc: Build the whole workspace
    cmds:
      - cargo build --workspace --exclude conformance

  test:
    desc: Run the test suite
    cmds:
      - cargo test --workspace --exclude conformance

  test:hooks:
    desc: Run native hook tests (task test:hooks -- [cargo test arguments])
    cmds:
      - cargo test -p poly-hooks {{.CLI_ARGS}}

  lint:
    desc: Clippy (deny warnings) plus poly's own lint over the repo
    cmds:
      - cargo clippy --workspace --exclude conformance --all-targets -- -D warnings
      - "{{.POLY}} lint ."

  format:
    desc: Format Rust with rustfmt and the rest of the tree with polyfmt
    aliases: [fmt]
    cmds:
      - cargo fmt
      - "{{.POLY}} fmt --fix ."

  format:check:
    desc: Verify formatting without writing changes
    aliases: [fmt:check]
    cmds:
      - cargo fmt --check
      - "{{.POLY}} fmt ."

  hooks:
    desc: Run the full pre-commit hook stage from poly.toml over all files
    cmds:
      - "{{.POLY}} hooks run pre-commit --all-files"

  bench:
    desc: Run benchmarks
    cmds:
      - cargo bench --workspace --exclude conformance

  conformance:
    desc: Run the Docker-based conformance harness vs reference formatters
    cmds:
      - cargo test -p conformance

  harden:
    desc: "Run poly against pinned third-party trees (usage: task harden -- django ripgrep)"
    cmds:
      - ./scripts/harden.sh {{.CLI_ARGS}}

  harden:local:
    desc: Run the harness against the sibling working trees next door — read-only
    cmds:
      - POLY_HARDEN_CORPUS=a ./scripts/harden.sh {{.CLI_ARGS}}

  harden:generated:
    desc: Run the harness against generated-code repositories (rule-audit input)
    cmds:
      - POLY_HARDEN_CORPUS=c ./scripts/harden.sh {{.CLI_ARGS}}

  check:
    desc: Full local gate (format check, lint, test) — run before pushing
    cmds:
      - task: format:check
      - task: lint
      - task: test

  package:npm:
    desc: "Stage a local poly build into the npm platform package and pack it (usage: task package:npm)"
    cmds:
      - ./npm-package/stage-binaries.sh --local "$PWD/target/debug/poly"
      - cd npm-package && pnpm pack

  package:wheels:
    desc: "Build a platform wheel from a local poly build (usage: task package:wheels)"
    cmds:
      - uv run --no-project --with build --with hatchling python pip-package/build_wheels.py --local "$PWD/target/debug/poly"

  set-version:
    desc: "Set the release version in the workspace Cargo.toml (usage: task set-version -- 0.1.8)"
    cmds:
      - "./scripts/release-bump.sh {{.CLI_ARGS}}"

  plugin:generate:
    desc: Generate all coding-agent plugin profiles and public skills
    cmds:
      - ai-rulez generate --plugin --no-local --strict-config
      - python3 scripts/sync_public_skills.py

  plugin:verify:
    desc: Verify native plugin bundles, versions, and public exports
    cmds:
      - ai-rulez verify --plugin
      - python3 scripts/sync_plugin_version.py --check
      - python3 scripts/sync_public_skills.py --check

  plugin:test:
    desc: Verify OpenCode, Hermes protocol, and public skill contracts
    cmds:
      - node --test scripts/tests/opencode-plugin.test.mjs
      - uv run --no-project --with mcp==1.28.1 --with PyYAML==6.0.3 python -m unittest discover -s scripts/tests
