[package]
name = "poly-component-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Host side of poly engine components: lazy loading, the component protocol client and the ComponentEngine proxy."

[lib]
name = "poly_component_host"
path = "src/lib.rs"

[dependencies]
alef-component-abi.workspace = true
alef-component-runtime.workspace = true
anyhow.workspace = true
poly-component-protocol.workspace = true
poly-config.workspace = true
poly-engine-api.workspace = true
poly-engines.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
poly-engines = { workspace = true, features = ["sql"] }
rayon.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true

# The alef-generated contract proxy in `components_gen.rs` calls the component through raw function
# pointers; that module alone opts back in with `#[allow(unsafe_code)]`, which `forbid` would not permit.
[lints.rust]
unsafe_code = "deny"
