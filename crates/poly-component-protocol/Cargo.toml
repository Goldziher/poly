[package]
name = "poly-component-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Language-neutral wire protocol (MessagePack + JSON Schema) for poly engine components."

[lib]
name = "poly_component_protocol"
path = "src/lib.rs"

[features]
# Derive `schemars::JsonSchema` on the wire types and expose `json_schema()`. Off by default: the
# released core never publishes the schema. The crate's own tests turn it on. ~keep
schemars = ["dep:schemars"]

[dependencies]
rmp-serde.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
poly-component-protocol = { path = ".", features = ["schemars"] }
proptest.workspace = true

[lints.rust]
unsafe_code = "forbid"
