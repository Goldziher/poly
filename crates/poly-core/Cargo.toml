[package]
name = "poly-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Core engine for the poly universal, zero-dependency linter & formatter"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.cargo-machete]
ignored = ["rumdl", "serde_toon_format", "rust-ini"]

[lib]
name = "poly_core"
path = "src/lib.rs"

[features]
# Derive `schemars::JsonSchema` on the public report types (Diagnostic, Span,
# Edit, Severity, LintResult, FormatResult, RunDebug, EngineDebug) so downstream
# crates (poly-mcp) can expose them as MCP structured tool output. Off by default. ~keep
schemars = ["dep:schemars", "poly-engine-api/schemars"]

# Engine families. The core (registry, runner, config, cache, report, tree-sitter generic tier,
# catalog/native-toolchain tiers) is always compiled; each family below adds its heavy engines.
# A language whose family is off falls through to the tree-sitter generic tier.
default = ["all-engines"]
# Link every engine family into the binary (the dev and test configuration). Alias of `all-engines`.
bundled = ["all-engines"]
all-engines = [
  "engine-web",
  "engine-python",
  "engine-php",
  "engine-sql",
  "engine-biome",
  "engine-ruby",
  "engine-nix",
  "engine-typos",
  "engine-quality",
  "engine-astgrep",
  "engine-uncomment",
  "engine-dockerfile",
  "engine-dotenv",
  "engine-ini",
  "engine-hcl",
  "engine-graphql",
]
# oxc (JS/TS/JSON format + lint, oxlint/oxfmt native config), taplo, markup_fmt, malva,
# markdown (rumdl + adrlint + markdown_fmt/embed), yaml, sort-package-json.
engine-web = [
  "dep:adrlint",
  "dep:malva",
  "dep:markup_fmt",
  "dep:oxc_allocator",
  "dep:oxc_diagnostics",
  "dep:oxc_formatter",
  "dep:oxc_formatter_core",
  "dep:oxc_formatter_css",
  "dep:oxc_formatter_json",
  "dep:oxc_formatter_markdown",
  "dep:oxc_formatter_toml",
  "dep:oxc_formatter_yaml",
  "dep:oxc_linter",
  "dep:oxc_parser",
  "dep:oxc_semantic",
  "dep:oxc_span",
  "dep:rumdl",
  "dep:serde_yaml",
  "dep:sort-package-json",
  "dep:taplo",
]
engine-python = ["dep:poly-engines-python"]
engine-php = ["dep:poly-engines-php"]
engine-sql = ["dep:poly-engines-sql"]
# Biome-backed CSS and GraphQL lint.
engine-biome = [
  "dep:biome_analyze",
  "dep:biome_css_analyze",
  "dep:biome_css_parser",
  "dep:biome_diagnostics",
  "dep:biome_graphql_analyze",
  "dep:biome_graphql_parser",
  "dep:biome_languages",
  "dep:biome_rowan",
]
engine-ruby = ["dep:rubyfmt"]
engine-nix = ["dep:poly-engines-nix"]
engine-typos = ["dep:typos", "dep:typos-dict", "dep:unicase"]
# The poly-native structural quality rules (no third-party engine dependency).
engine-quality = []
engine-astgrep = ["dep:ast-grep-config", "dep:ast-grep-core"]
engine-uncomment = ["dep:uncomment"]
engine-dockerfile = ["dep:dockerfile-parser"]
engine-dotenv = ["dep:dotenv-analyzer", "dep:dotenv-core"]
engine-ini = ["dep:rust-ini"]
engine-hcl = ["dep:hcl-edit"]
engine-graphql = ["dep:graphql-parser", "dep:pretty_graphql"]

[dependencies]
adrlint = { workspace = true, optional = true }
anyhow.workspace = true
ast-grep-config = { workspace = true, optional = true }
ast-grep-core = { workspace = true, optional = true }
biome_analyze = { workspace = true, optional = true }
biome_css_analyze = { workspace = true, optional = true }
biome_css_parser = { workspace = true, optional = true }
biome_diagnostics = { workspace = true, optional = true }
biome_graphql_analyze = { workspace = true, optional = true }
biome_graphql_parser = { workspace = true, optional = true }
biome_languages = { workspace = true, optional = true }
biome_rowan = { workspace = true, optional = true }
blake3.workspace = true
dockerfile-parser = { workspace = true, optional = true }
dotenv-analyzer = { workspace = true, optional = true }
dotenv-core = { workspace = true, optional = true }
flate2.workspace = true
globset.workspace = true
graphql-parser = { workspace = true, optional = true }
hcl-edit = { workspace = true, optional = true }
ignore.workspace = true
malva = { workspace = true, features = ["config_serde"], optional = true }
markup_fmt = { workspace = true, features = ["config_serde"], optional = true }
owo-colors.workspace = true
oxc_allocator = { workspace = true, optional = true }
oxc_diagnostics = { workspace = true, optional = true }
oxc_formatter = { workspace = true, optional = true }
oxc_formatter_core = { workspace = true, optional = true }
oxc_formatter_css = { workspace = true, optional = true }
oxc_formatter_json = { workspace = true, optional = true }
oxc_formatter_markdown = { workspace = true, optional = true }
oxc_formatter_toml = { workspace = true, optional = true }
oxc_formatter_yaml = { workspace = true, optional = true }
oxc_linter = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_semantic = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
poly-cache.workspace = true
poly-catalog.workspace = true
poly-component-protocol.workspace = true
poly-config.workspace = true
poly-engine-api.workspace = true
poly-engines-nix = { workspace = true, optional = true }
poly-engines-php = { workspace = true, optional = true }
poly-engines-python = { workspace = true, optional = true }
poly-engines-sql = { workspace = true, optional = true }
pretty_graphql = { workspace = true, features = ["config_serde"], optional = true }
rayon.workspace = true
regex.workspace = true
rubyfmt = { workspace = true, optional = true }
rumdl = { workspace = true, optional = true }
rust-ini = { workspace = true, optional = true }
rustc-hash.workspace = true
# Optional: only compiled when the `schemars` feature is enabled (by poly-mcp) to
# derive JsonSchema on the public report types for MCP structured output.
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_toon_format.workspace = true
serde_yaml = { workspace = true, optional = true }
sha2.workspace = true
sort-package-json = { workspace = true, optional = true }
taplo = { workspace = true, optional = true }
tar.workspace = true
tempfile.workspace = true
terminal_size.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-language-pack.workspace = true
typos = { workspace = true, optional = true }
typos-dict = { workspace = true, optional = true }
uncomment = { workspace = true, optional = true }
unicase = { workspace = true, optional = true }
ureq.workspace = true
which.workspace = true
zip.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
owo-colors.workspace = true
poly-component-index.workspace = true
proptest.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "generic_formatter"
harness = false

[[bench]]
name = "cache_key"
harness = false

[[bench]]
name = "runner_e2e"
harness = false
