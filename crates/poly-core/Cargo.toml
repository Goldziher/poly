[package]
name = "poly-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Core engine of polylint, the universal polyglot linter and formatter"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_toon_format"]

[lib]
name = "poly_core"
path = "src/lib.rs"

[features]
# Derive `schemars::JsonSchema` on the public report types (Diagnostic, Span,
# Edit, Severity, LintResult, FormatResult, RunDebug, EngineDebug) so downstream
# crates (poly-mcp) can expose them as MCP structured tool output. Off by default. ~keep
schemars = ["dep:schemars", "poly-engine-api/schemars"]

# Engine families. The core (registry, runner, config, cache, report, tree-sitter generic tier,
# catalog/native-toolchain tiers) is always compiled; each family below adds its heavy engines.
# A language whose family is off falls through to the tree-sitter generic tier.
default = ["all-engines"]
# Read a development component lock from `POLY_COMPONENT_DEV_LOCK` (`mise run components:dev`).
# Never in a release build: publish.yaml fails the build if the binary names the variable. ~keep
dev-lock = []
# Link every engine family into the binary (the dev and test configuration). Alias of `all-engines`.
bundled = ["all-engines"]
# The families the released core links (ADR 0039, narrowed by ADR 0043): poly's own quality rules,
# which share the tree-sitter runtime. Every family wrapping an outside engine is a downloadable
# component.
core = ["engine-quality"]
all-engines = [
  "engine-python",
  "engine-php",
  "engine-sql",
  "engine-nix",
  "engine-typos",
  "engine-quality",
  "engine-astgrep",
  "engine-uncomment",
  "engine-dockerfile",
  "engine-dotenv",
  "engine-ini",
  "engine-hcl",
  "engine-graphql",
  "engine-shfmt",
]
# Shell is formatted by the host `shfmt` tool (the native-toolchain engine) instead of the `sh`
# sidecar component, which a build without it downloads. A bundled binary cannot link the Go
# sidecar, so it keeps the host tool. ADR 0045.
engine-shfmt = []
engine-python = ["dep:poly-engines-python"]
engine-php = ["dep:poly-engines-php"]
engine-sql = ["dep:poly-engines-sql"]
engine-nix = ["dep:poly-engines-nix"]
engine-typos = ["dep:poly-engines-typos"]
# The poly-native structural quality rules (no third-party engine dependency).
engine-quality = []
engine-astgrep = ["dep:poly-engines-astgrep"]
engine-uncomment = ["dep:poly-engines-uncomment"]
engine-dockerfile = ["dep:poly-engines-misc", "poly-engines-misc/dockerfile"]
engine-dotenv = ["dep:poly-engines-misc", "poly-engines-misc/dotenv"]
engine-ini = ["dep:poly-engines-misc", "poly-engines-misc/ini"]
engine-hcl = ["dep:poly-engines-misc", "poly-engines-misc/hcl"]
engine-graphql = ["dep:poly-engines-misc", "poly-engines-misc/graphql"]

[dependencies]
anyhow.workspace = true
blake3.workspace = true
flate2.workspace = true
fs2.workspace = true
globset.workspace = true
ignore.workspace = true
owo-colors.workspace = true
poly-cache.workspace = true
poly-catalog.workspace = true
poly-component-host.workspace = true
poly-component-index.workspace = true
poly-component-protocol.workspace = true
poly-config.workspace = true
poly-engine-api.workspace = true
poly-engines-astgrep = { workspace = true, optional = true }
poly-engines-misc = { workspace = true, optional = true }
poly-engines-nix = { workspace = true, optional = true }
poly-engines-php = { workspace = true, optional = true }
poly-engines-python = { workspace = true, optional = true }
poly-engines-sql = { workspace = true, optional = true }
poly-engines-typos = { workspace = true, optional = true }
poly-engines-uncomment = { workspace = true, optional = true }
poly-grammar.workspace = true
rayon.workspace = true
regex.workspace = true
rustc-hash.workspace = true
# Optional: only compiled when the `schemars` feature is enabled (by poly-mcp) to
# derive JsonSchema on the public report types for MCP structured output.
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_toon_format.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
terminal_size.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-language-pack.workspace = true
ureq.workspace = true
which.workspace = true
zip.workspace = true

[dev-dependencies]
alef-component-runtime.workspace = true
criterion.workspace = true
insta.workspace = true
owo-colors.workspace = true
proptest.workspace = true
tracing-subscriber.workspace = true

[[test]]
name = "component_parity"
required-features = ["dev-lock"]

[[bench]]
name = "generic_formatter"
harness = false

[[bench]]
name = "cache_key"
harness = false

[[bench]]
name = "runner_e2e"
harness = false
