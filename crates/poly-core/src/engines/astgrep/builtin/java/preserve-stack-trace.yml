id: preserve-stack-trace
language: java
severity: warning
message: "Rethrowing a new exception without the caught one as its cause discards the original stack trace; pass the caught exception to the constructor."
note: |
  Every `Throwable` constructor family has a `(String message, Throwable cause)`
  overload, and `Throwable.initCause` exists for the ones that do not. Throwing
  `new IllegalStateException("could not load config")` from inside a `catch`
  drops the frames that say *why* loading failed - the reader gets your message
  and nothing else, and the real error is unrecoverable from the log.

  Write `throw new IllegalStateException("could not load config", e);` instead.
  The caught exception then appears in the printed trace under `Caused by:`, so
  the wrapper adds context without destroying evidence.

  The check binds the identifier declared by the `catch` clause and reports a
  `throw new ...(...)` inside that clause when the identifier appears nowhere in
  the constructor's argument list. Any mention counts as preserving the cause,
  including `e.getCause()` and `e.getMessage()` - the latter still loses the
  trace, but distinguishing the two needs type information ast-grep does not
  have, so the rule stays on the conservative side. It also only sees the
  constructor arguments: assigning the exception to a local and calling
  `initCause` afterwards is not recognised and is reported.

  Because it looks for a `throw new ...` lexically inside the `catch`, a throw
  written inside a lambda or anonymous class that the catch body merely creates
  is attributed to the catch and reported.

  Measured on poly's 50-repository corpus: 399 `throw new ...` sites sit inside
  a `catch`, and all 399 already pass the caught exception to the constructor,
  so the rule reported none of them (0 false positives across 399 decisions).
  There was no real violation in the corpus to catch; the rule was verified
  against a planted known-positive.

  Idea origin: the `Throwable(String, Throwable)` cause chaining introduced in
  JDK 1.4 and the "always chain the cause when wrapping" guidance in the Java
  exception documentation. The matcher and the message were authored
  independently for poly from that concept.
url: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Throwable.html#getCause()
rule:
  all:
    - kind: throw_statement
    - inside:
        stopBy: end
        kind: catch_clause
        has:
          kind: catch_formal_parameter
          has:
            field: name
            pattern: $CAUGHT
    - has:
        stopBy: neighbor
        kind: object_creation_expression
        has:
          field: arguments
          not:
            has:
              stopBy: end
              kind: identifier
              pattern: $CAUGHT
