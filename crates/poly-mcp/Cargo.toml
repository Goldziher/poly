[package]
name = "poly-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "MCP (Model Context Protocol) server over stdio that mirrors the poly CLI's lint/format/cache capabilities, reaching the engines through host services."
keywords = ["mcp", "linter", "formatter", "lint", "format"]
categories = ["development-tools"]

[package.metadata.cargo-machete]
# `serde_toon_format`'s crate/lib name is `serde_toon`, so cargo-machete's
# name-based scan can't see the `serde_toon::to_string` use in `dto.rs`.
ignored = ["serde_toon_format"]

[dependencies]
anyhow.workspace = true
# Folds the host's engine versions into one digest on the identity block,
# framed the way the result cache frames its key.
blake3.workspace = true
# The build identity every tool response carries, so an MCP caller can tell
# which binary answered (an MCP caller cannot run `poly --version`).
poly-buildinfo.workspace = true
# The service seam to the host, and the report types both sides share. The `schemars`
# feature derives the output schemas the tools publish.
poly-frontend-api = { workspace = true, features = ["schemars"] }
rmcp = { workspace = true, features = ["server", "transport-io", "macros"] }
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# TOON rendering for the non-lint/format tool DTOs (lint/format arrive pre-rendered from the
# host). Imported as `serde_toon`. ~keep
serde_toon_format.workspace = true
tokio.workspace = true

[dev-dependencies]
# The tests run the server over the real host services, in process: the same wire path a
# downloaded component takes, with `Services` standing in for the component ABI's service table.
poly-core = { workspace = true, features = ["all-engines", "schemars"] }
poly-host-services = { workspace = true, features = ["all-engines"] }
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
