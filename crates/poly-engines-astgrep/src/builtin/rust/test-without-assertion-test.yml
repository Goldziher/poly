id: test-without-assertion
valid:
  - "#[test]\nfn t() { assert_eq!(add(1, 2), 3); }"
  - "#[test]\nfn t() { assert!(is_ok()); }"
  - "#[test]\nfn t() { debug_assert_ne!(a, b); }"
  - "#[test]\nfn t() { insta::assert_yaml_snapshot!(value); }"
  - "#[test]\nfn t() -> Result<(), E> {\n    run()?;\n    Ok(())\n}"
  - "#[test]\nfn t() { let v = parse(\"x\").unwrap(); }"
  - "#[test]\nfn t() { parse(\"x\").expect(\"parses\"); }"
  - "#[test]\n#[should_panic]\nfn t() { divide(1, 0); }"
  - "#[tokio::test]\nasync fn t() { assert!(client.get().await.is_ok()); }"
  - "fn helper() { setup(); }"
  - "#[test]\nfn t() { panic!(\"not implemented\"); }"
  - "#[test]\n#[ignore]\nfn t() { expensive(); }"
  - "#[wasm_bindgen_test]\nfn t() { assert!(ok()); }"
  - "#[test]\nfn t() { assert_is_security_error(result, \"too many files\"); }"
  - "#[test]\nfn t() { check_local_nodes(&graph, \"main.py\", &[]); }"
  - "#[test]\nfn t() { cli().arg(\"--debug\").write_stdin(\"<p>x</p>\").assert().success(); }"
  - "#[test]\nfn t() {\n    fn assert_send_sync<T: Send + Sync>() {}\n    assert_send_sync::<Resolver>();\n}"
  - "#[test]\nfn t() { verify_round_trip(&doc); }"
  - "#[test]\nfn t() { build_and_check_stack_graph_edges(src, tsg, &[]); }"
  - "#[test]\nfn t() {\n    run();\n    logs_assert(|lines: &[&str]| Ok(()));\n}"
  - "#[test]\nfn t() {\n    fn _assert_signature(f: fn(u8) -> u8) {}\n    _assert_signature(run);\n}"
  - "#[test]\nfn t() { test_citation(None, None, 10.0, 7.0); }"
  - "#[test]\nfn t() {\n    let doc = b.build();\n    validate_json(&render_json(&doc));\n}"
invalid:
  - "#[test]\nfn t() { let _ = add(1, 2); }"
  - "#[test]\nfn t() { run_pipeline(); }"
  - "#[test]\nfn t() {}"
  - "#[tokio::test]\nasync fn t() { client.get().await; }"
  - "#[test]\nfn t() {\n    let cfg = Config::default();\n    let engine = Engine::new(cfg);\n    engine.warm_up();\n}"
