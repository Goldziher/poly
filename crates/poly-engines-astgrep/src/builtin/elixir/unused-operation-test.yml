id: unused-operation
valid:
  - "defmodule M do\n  def run(name) do\n    String.upcase(name)\n  end\nend\n"
  - "defmodule M do\n  def run(list) do\n    Enum.map(list, &double/1)\n  end\nend\n"
  - "defmodule M do\n  def run(name) do\n    upcased = String.upcase(name)\n    upcased\n  end\nend\n"
  - "defmodule M do\n  def run(name) do\n    name\n    |> String.upcase()\n    |> String.trim()\n  end\nend\n"
  - "defmodule M do\n  def run(list) do\n    Enum.each(list, &IO.puts/1)\n    :ok\n  end\nend\n"
  - "defmodule M do\n  def run(list) do\n    IO.puts(\"start\")\n    Enum.reduce(list, 0, &+/2)\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    try do\n      String.upcase(x)\n    rescue\n      e -> e\n    end\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    try do\n      String.upcase(x)\n    after\n      cleanup()\n    end\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    if x do\n      String.upcase(x)\n    else\n      String.downcase(x)\n    end\n  end\nend\n"
  - "defmodule M do\n  defmacro run(x) do\n    quote do\n      String.upcase(unquote(x))\n      :ok\n    end\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    case x do\n      1 -> String.upcase(x)\n      _ -> :none\n    end\n  end\nend\n"
  - "defmodule M do\n  def run(a, b) do\n    total = a + b\n    total\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    Repo.insert(x)\n    :ok\n  end\nend\n"
  - "defmodule M do\n  def expired?(entry) do\n    now = System.monotonic_time(:second)\n    now - entry.created_at > entry.ttl\n  end\nend\n"
  - "defmodule M do\n  def path_param(params, name), do: Map.get(params, name)\nend\n"
  - "defmodule M do\n  def process(result, config) do\n    if config && Map.get(config, \"uppercase\") do\n      Map.update(result, \"content\", \"\", &String.upcase/1)\n    else\n      result\n    end\n  end\nend\n"
  - "defmodule M do\n  defp normalize(value) when is_binary(value) do\n    String.downcase(value)\n  end\n\n  defp normalize(value), do: value\nend\n"
invalid:
  - "defmodule M do\n  def run(list) do\n    Enum.map(list, &double/1)\n    :ok\n  end\nend\n"
  - "defmodule M do\n  def run(name) do\n    String.upcase(name)\n    name\n  end\nend\n"
  - "defmodule M do\n  def run(list, other) do\n    list ++ other\n    list\n  end\nend\n"
  - "defmodule M do\n  def run(a, b) do\n    a + b\n    :ok\n  end\nend\n"
  - "defmodule M do\n  def run(x, y) do\n    x == y\n    :ok\n  end\nend\n"
  - "defmodule M do\n  def run(m) do\n    Map.put(m, :a, 1)\n    m\n  end\nend\n"
  - "defmodule M do\n  def run(x) do\n    if x do\n      String.upcase(x)\n      :ok\n    end\n  end\nend\n"
