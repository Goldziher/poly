[package]
name = "poly-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Universal, zero-dependency linter & formatter: a single `poly` CLI (poly lint / poly fmt) that handles every language in-process, no per-language toolchains required."
keywords = ["linter", "formatter", "polyglot", "universal", "lint"]
categories = ["development-tools", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/poly-{ version }-{ target }.{ archive-suffix }"
bin-dir = "."

[lib]
name = "poly_cli"
path = "src/lib.rs"

[[bin]]
name = "poly"
path = "src/main.rs"

[features]
default = ["mcp", "all-engines"]
# `poly mcp` subcommand (pulls rmcp + tokio, and every engine via poly-mcp).
mcp = ["dep:poly-mcp"]
# Every engine family compiled in. Drop it (`--no-default-features`) for the core-only binary.
all-engines = ["poly-core/all-engines", "engine-astgrep"]
# `poly rules` drives the ast-grep engine directly, so the subcommand needs the family.
engine-astgrep = ["poly-core/engine-astgrep"]

[dependencies]
aho-corasick.workspace = true
anyhow.workspace = true
clap.workspace = true
fs2.workspace = true
gitfluff.workspace = true
ignore.workspace = true
json5.workspace = true
owo-colors.workspace = true
poly-buildinfo.workspace = true
poly-cache.workspace = true
poly-catalog.workspace = true
poly-config.workspace = true
poly-core.workspace = true
poly-hooks.workspace = true
# Optional: the `poly mcp` subcommand (rmcp + tokio). See the `mcp` feature.
poly-mcp = { workspace = true, optional = true }
poly-workspace.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
which.workspace = true

[dev-dependencies]
insta.workspace = true
libc.workspace = true

[[test]]
# One process per root, driven by `scripts/harden.sh`. Declared explicitly so the
# harness can be several files without each becoming its own test binary.
name = "harden"
path = "tests/harden/main.rs"
