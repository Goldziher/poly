[package]
name = "poly-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Unified result-cache (blake3, namespaced, file-set digest) for poly lint, poly fmt, and poly hooks"
publish = false

# Only for `geteuid`, to prove poly owns a cache directory before changing its
# mode. Safe wrapper, so the crate keeps `unsafe_code = "forbid"`.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lib]
name = "poly_cache"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
dunce.workspace = true
etcetera.workspace = true
poly-buildinfo.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
