[package]
name = "poly-engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Facade over poly's engine family crates and the component contract trait."

[lib]
name = "poly_engines"
path = "src/lib.rs"

[features]
# One feature per engine family; each links and re-exports that family crate.
astgrep = ["dep:poly-engines-astgrep"]
# The MCP frontend component: poly-mcp (rmcp, tokio) behind the `PolyFrontend` contract.
mcp = ["dep:alef-component-abi", "dep:poly-frontend-api", "dep:poly-mcp", "dep:serde_json"]
misc = [
  "dep:poly-engines-misc",
  "poly-engines-misc/dockerfile",
  "poly-engines-misc/dotenv",
  "poly-engines-misc/hcl",
  "poly-engines-misc/graphql",
]
nix = ["dep:poly-engines-nix"]
php = ["dep:poly-engines-php"]
python = ["dep:poly-engines-python"]
sql = ["dep:poly-engines-sql"]
typos = ["dep:poly-engines-typos"]
uncomment = ["dep:poly-engines-uncomment"]

[dependencies]
alef-component-abi = { workspace = true, optional = true }
anyhow.workspace = true
poly-component-protocol.workspace = true
poly-engine-api.workspace = true
poly-engines-astgrep = { workspace = true, optional = true }
poly-engines-misc = { workspace = true, optional = true }
poly-engines-nix = { workspace = true, optional = true }
poly-engines-php = { workspace = true, optional = true }
poly-engines-python = { workspace = true, optional = true }
poly-engines-sql = { workspace = true, optional = true }
poly-engines-typos = { workspace = true, optional = true }
poly-engines-uncomment = { workspace = true, optional = true }
poly-frontend-api = { workspace = true, optional = true }
poly-mcp = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
poly-component-index.workspace = true

[lints.rust]
unsafe_code = "forbid"
