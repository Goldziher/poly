# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. CI and the release workflow
# install Rust with dtolnay/rust-toolchain, and tasks build poly from this checkout, so no tool here pins
# Rust or poly. ~keep
[settings]
lockfile = true
# macos-x64 too: the release builds the x86_64-apple-darwin components on an Intel runner with alef from mise.
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]

[tools]
python = "3.15.2"
uv = "0.13.7"
node = "26.13.0"
pnpm = "12.18.0"
go = "1.27.3"
# The Go sidecar's gates (components/sidecars): lint, vulnerability scan and licence check.
golangci-lint = "2.15.0"
# The host shfmt the sh sidecar's output is compared with byte for byte (components/sidecars/sh).
shfmt = "3.14.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
# The component build tool; keep in step with alef-component-abi/runtime in Cargo.toml.
"github:xberg-io/alef" = "0.128.0"

[vars]
# Tasks run the bundled poly (core plus the web, biome and ruby engines, built from components/) from this
# checkout, so they lint and format with the code under change. The core alone cannot handle TOML, Markdown,
# JSON, YAML, JS/TS or CSS without a downloadable component. ~keep
poly = "cargo run -q --manifest-path components/Cargo.toml -p poly-bundled --bin poly --"
# ai-rulez is never pinned: every task runs its newest release on the baseline Node. ~keep
ai_rulez = "npx -y ai-rulez@latest"

[tasks.setup]
description = "Fetch dependencies and install the git hooks"
run = [
  "mise install",
  "cargo fetch",
  "cargo fetch --manifest-path components/Cargo.toml",
  "cargo fetch --manifest-path components-pyrefly/Cargo.toml",
  "{{vars.poly}} hooks install",
]

[tasks.build]
description = "Build the root workspace and the components workspaces"
run = [
  "cargo build --workspace --exclude conformance",
  "cargo build --manifest-path components/Cargo.toml --workspace",
  "cargo build --manifest-path components-pyrefly/Cargo.toml --workspace",
]

[tasks.test]
description = "Run the test suite of the root workspace and the components workspaces"
run = [
  "cargo test --workspace --exclude conformance",
  "cargo test --manifest-path components/Cargo.toml --workspace --no-fail-fast",
  "cargo test --manifest-path components-pyrefly/Cargo.toml --workspace --no-fail-fast",
]

[tasks."test:hooks"]
description = "Run native hook tests; cargo test arguments follow -- -- (mise run test:hooks -- -- filter -- --nocapture)"
usage = 'arg "[args]..." var=#true help="Arguments passed to cargo test"'
run = 'eval "set -- ${usage_args:-}"; cargo test -p poly-hooks "$@"'

[tasks.lint]
description = "Clippy (deny warnings) plus poly's own lint over the repo"
run = [
  "cargo clippy --workspace --exclude conformance --all-targets -- -D warnings",
  "cargo clippy --manifest-path components/Cargo.toml --workspace --all-targets -- -D warnings",
  "cargo clippy --manifest-path components-pyrefly/Cargo.toml --workspace --all-targets -- -D warnings",
  "{{vars.poly}} lint .",
]

[tasks.format]
description = "Format Rust with rustfmt and the rest of the tree with polyfmt"
alias = ["fmt"]
run = [
  "cargo fmt",
  "cargo fmt --manifest-path components/Cargo.toml --all",
  "cargo fmt --manifest-path components-pyrefly/Cargo.toml --all",
  "{{vars.poly}} fmt --fix .",
]

[tasks."format:check"]
description = "Verify formatting without writing changes"
alias = ["fmt:check"]
run = [
  "cargo fmt --check",
  "cargo fmt --manifest-path components/Cargo.toml --all --check",
  "cargo fmt --manifest-path components-pyrefly/Cargo.toml --all --check",
  "{{vars.poly}} fmt .",
]

[tasks.hooks]
description = "Run the full pre-commit hook stage from poly.toml over all files"
run = "{{vars.poly}} hooks run pre-commit --all-files"

[tasks.bench]
description = "Run benchmarks"
run = "cargo bench --workspace --exclude conformance"

[tasks.conformance]
description = "Run the Docker-based conformance harness vs reference formatters"
run = "cargo test -p conformance"

[tasks.check]
description = "Full local gate (format check, lint, test) — run before pushing"
run = [{ task = "format:check" }, { task = "lint" }, { task = "test" }]

[tasks."package:npm"]
description = "Stage a local poly build into the npm platform package and pack it (usage: mise run package:npm)"
run = ['./npm-package/stage-binaries.sh --local "$PWD/target/debug/poly"', "cd npm-package && pnpm pack"]

[tasks."package:wheels"]
description = "Build a platform wheel from a local poly build (usage: mise run package:wheels)"
run = 'uv run --no-project --with build --with hatchling python pip-package/build_wheels.py --local "$PWD/target/debug/poly"'

[tasks."plugin:generate"]
description = "Generate all coding-agent plugin profiles and public skills"
run = ["{{vars.ai_rulez}} generate --plugin --no-local --strict-config", { task = "plugin:sync-skills" }]

[tasks."plugin:verify"]
description = "Verify native plugin bundles, versions, and public exports"
run = [
  "{{vars.ai_rulez}} verify --plugin",
  { task = "plugin:sync-version --check" },
  { task = "plugin:sync-skills --check" },
]

[tasks."plugin:test"]
description = "Verify OpenCode, Hermes protocol, and public skill contracts"
run = [
  "node --test mise-tasks/tests/opencode-plugin.test.mjs",
  "uv run --no-project --with mcp==2.3.0 --with PyYAML==6.0.3 python -m unittest discover -s mise-tasks/tests",
]
