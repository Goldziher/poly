name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level: only `contents: write`, which the
# release-asset steps need. The npm and PyPI jobs additionally request
# `id-token: write` on themselves, because trusted publishing (OIDC) mints its
# token from that claim — granting it to every job would hand the whole matrix a
# credential that can publish packages.
permissions:
  contents: write

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
      npm_bootstrapped: ${{ steps.registries.outputs.npm_bootstrapped }}
      pypi_exists: ${{ steps.registries.outputs.pypi_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo version: $version"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          target_version="${{ steps.version.outputs.version }}"

          echo "Verifying version consistency for: $target_version"

          # Check Cargo.toml workspace version
          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          # The wrapper packages ship in lock-step (scripts/release-bump.sh moves
          # them with Cargo.toml). Check them here too: a package publishing the
          # wrong version is not recoverable — npm and PyPI both refuse to
          # overwrite a released version.
          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          for manifest in npm-package/platforms/*/package.json; do
            platform_version="$(jq -r '.version' "$manifest")"
            if [ "$platform_version" != "$target_version" ]; then
              echo "::error::$manifest version mismatch: expected $target_version, got $platform_version"
              exit 1
            fi
          done

          # The main package pins its platform packages exactly; a stale pin here
          # resolves to the previous release's binary under the new version.
          while read -r pinned; do
            if [ "$pinned" != "$target_version" ]; then
              echo "::error::npm-package/package.json optionalDependencies pin mismatch: expected $target_version, got $pinned"
              exit 1
            fi
          done < <(jq -r '.optionalDependencies[]' npm-package/package.json)

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/polylint/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_version" ]; then
            echo "::error::pip-package/polylint/__init__.py version mismatch: expected $target_version, got $init_version"
            exit 1
          fi

          echo "✓ Version verified across Cargo + npm + PyPI: $cargo_version"

      - name: Detect registry readiness
        id: registries
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # npm can only name a trusted publisher for a package that already
          # exists, so a package's first publish is always manual. The umbrella
          # package was bootstrapped and has a trusted publisher configured; this
          # check exists so that a *new* platform package added to the matrix
          # skips the job with a notice rather than failing a release on a step
          # that cannot yet succeed. See docs/INSTALL-PACKAGES.md.
          npm_bootstrapped=false
          if npm view "@goldziher/polylint" version >/dev/null 2>&1; then
            npm_bootstrapped=true
          else
            echo "::notice::@goldziher/polylint is not on npm; skipping the npm publish. It needs a one-time manual publish before a trusted publisher can be configured for it (docs/INSTALL-PACKAGES.md)."
          fi

          # PyPI `polylint` already exists, so only the per-version check matters.
          pypi_exists=false
          if curl -fsS "https://pypi.org/pypi/polylint/${version}/json" >/dev/null 2>&1; then
            pypi_exists=true
          fi

          {
            echo "npm_bootstrapped=$npm_bootstrapped"
            echo "pypi_exists=$pypi_exists"
          } >> "$GITHUB_OUTPUT"

          echo "npm bootstrapped? $npm_bootstrapped   PyPI ${version} already published? $pypi_exists"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          release_assets_exist=false

          if gh release view "$tag" >/dev/null 2>&1; then
            count="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "${count:-0}" -gt 0 ]; then
              release_assets_exist=true
            fi
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  create_release:
    name: Create GitHub release
    needs: meta
    if: needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            # A pre-existing release can be live but incomplete — a re-run, a
            # tag pushed twice, or a release created outside this workflow. In
            # that state it is what /releases/latest resolves to, so every
            # consumer's installer picks it up and then fails the checksum
            # verification, because sha256sums.txt is not uploaded until the
            # whole build matrix finishes. Put it back into draft until
            # finalize_release has verified the full asset set. A release that
            # already carries sha256sums.txt is complete and is left alone.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft')" != "true" ] &&
              ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                grep -qx 'sha256sums.txt'; then
              echo "::warning::release $tag is published but has no sha256sums.txt; reverting to draft until its assets are complete"
              gh release edit "$tag" --draft=true --repo "$GITHUB_REPOSITORY"
            fi
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            # Create as a DRAFT. The build matrix uploads binaries to it, but it
            # stays invisible (assets not publicly downloadable) until the
            # finalize_release job promotes it — and that job only runs once
            # checksums (which requires all platform binaries) succeeds. A failed
            # platform build therefore leaves a hidden draft, not a live release
            # with missing binaries and no checksums.
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

  build-binaries:
    name: Build binaries / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: needs.meta.outputs.release_assets_exist != 'true'
    runs-on: ${{ matrix.os }}
    # Stamp the build id from the tag we are releasing rather than leaving
    # build.rs to infer it from `git describe`. The release also force-moves the
    # `v0` major tag onto this commit, so a later workflow_dispatch re-run — the
    # only path that rebuilds — can have `git describe` resolve `v0`, whose
    # stripped form is "0" rather than the version, silently stamping a release
    # artifact as a `dev` build. An explicit id is what build.rs documents this
    # variable for.
    env:
      POLY_BUILD_ID: ${{ needs.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            alpine: true
          - triple: x86_64-apple-darwin
            os: macos-14
          - triple: aarch64-apple-darwin
            os: macos-14
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Rust
        if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Setup cache
        if: ${{ !matrix.alpine }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install clang for bindgen (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
        shell: bash

      - name: Build binary (native)
        if: ${{ !matrix.alpine }}
        run: cargo build --release --target ${{ matrix.triple }}
        shell: bash

      - name: Build binary (musl, Alpine container)
        if: ${{ matrix.alpine }}
        run: |
          # Build host-native inside rust:alpine (the image's host target already
          # IS x86_64-unknown-linux-musl). NOT `--target`: with an explicit target
          # Cargo applies RUSTFLAGS only to the target, leaving build scripts
          # static-musl — and ruby-prism-sys's bindgen build script must be
          # dynamically linked (-crt-static off) to dlopen libclang. Building
          # host-native applies the flag everywhere. Then place the binary at the
          # triple path the shared packaging step expects.
          docker run --rm -v "$PWD":/work -w /work \
            -e CARGO_TARGET_DIR=/work/target \
            -e LIBCLANG_PATH=/usr/lib \
            -e POLY_BUILD_ID="$POLY_BUILD_ID" \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            rust:alpine sh -c '
              set -e
              apk add --no-cache build-base musl-dev clang clang-dev llvm-dev pkgconf git perl
              cargo build --release
              mkdir -p "target/${{ matrix.triple }}/release"
              cp target/release/poly "target/${{ matrix.triple }}/release/poly"
              strip "target/${{ matrix.triple }}/release/poly"
            '
        shell: bash

      - name: Strip binary
        if: ${{ !matrix.alpine }}
        run: |
          case "${{ matrix.triple }}" in
            *windows*)
              # Windows binaries don't benefit from strip
              ;;
            *)
              strip target/${{ matrix.triple }}/release/poly || true
              ;;
          esac
        shell: bash

      - name: Create release artifacts
        run: |
          cd target/${{ matrix.triple }}/release

          case "${{ matrix.triple }}" in
            *windows*)
              7z a ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip poly.exe
              ;;
            *)
              tar czf ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz poly
              ;;
          esac
        shell: bash

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          case "${{ matrix.triple }}" in
            *windows*)
              archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip"
              ;;
            *)
              archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz"
              ;;
          esac

          if [ ! -f "$archive" ]; then
            echo "::error::Archive not found: $archive"
            exit 1
          fi

          gh release upload "$tag" "$archive" --clobber
        shell: bash

      - name: Save artifact for checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.triple }}
          path: |
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip
          if-no-files-found: ignore

  checksums:
    name: Generate and upload checksums
    needs: [meta, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: releases-*
          merge-multiple: true
          path: artifacts

      - name: Verify all expected archives are present
        run: |
          set -euo pipefail

          # Expected archives for the 6 build targets
          expected=(
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-apple-darwin.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-apple-darwin.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-pc-windows-msvc.zip"
          )

          missing_count=0
          for expected_asset in "${expected[@]}"; do
            if [ ! -f "artifacts/$expected_asset" ]; then
              echo "::error::Missing expected archive: $expected_asset"
              missing_count=$((missing_count + 1))
            fi
          done

          if [ $missing_count -gt 0 ]; then
            echo "::error::Release is incomplete: $missing_count of 6 platform archives missing. The release must have all 6 binaries before checksums can be generated."
            exit 1
          fi

          echo "✓ All 6 expected archives present"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sort > ../sha256sums.txt
          cat ../sha256sums.txt

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          gh release upload "$tag" sha256sums.txt --clobber

  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Promote draft to published release once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          # The full asset set the installer needs: every platform archive plus
          # the checksums file they verify against.
          required=(
            "poly-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${version}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${version}-x86_64-apple-darwin.tar.gz"
            "poly-${version}-aarch64-apple-darwin.tar.gz"
            "poly-${version}-x86_64-pc-windows-msvc.zip"
            "sha256sums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing required assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "✓ Promoted $tag to a published release"

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, finalize_release]
    if: needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Update tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail rather than skip. This step used to exit 0 on a missing token,
          # so an unset secret would have left `brew install` serving the
          # previous release indefinitely while the run still reported success.
          # A distribution channel that did not update is a failed release, not
          # a warning — and the failure has to be visible in the run that caused
          # it, not discovered later by a user installing a stale build.
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so the Homebrew tap cannot be updated." >&2
            echo "Set the secret, or re-run this job once it is configured; the tap will" >&2
            echo "otherwise keep serving the previous release indefinitely." >&2
            exit 1
          fi
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"

          # Prebuilt-binary formula: it points at the same release archives every
          # other channel serves, with the hashes read from the release's own
          # sha256sums.txt rather than recomputed. Homebrew used to compile poly
          # from source here, which meant a full cargo build of ruff + oxc +
          # biome + mago + tree-sitter for anyone the tap's bottler did not
          # cover — and its runner matrix has no Intel macOS, so those users
          # compiled on every install. The tap's auto-bottle.yml skips formulae
          # that declare no source build, so this needs nothing on the tap side.
          GH_TOKEN="$GITHUB_TOKEN" gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sha256sums.txt' --dir sums --clobber
          ./scripts/update-homebrew-formula.sh "$version" sums/sha256sums.txt "$GITHUB_REPOSITORY" > poly.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/homebrew-tap.git" tap
          cp poly.rb tap/Formula/poly.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/poly.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "poly ${version}"
            git push
          fi

  publish_scoop:
    name: Update Scoop bucket
    needs: [meta, finalize_release]
    if: needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    # Non-blocking: the bucket lives in another repository and its push needs a
    # PAT this workflow does not control. A missing or under-scoped token is a
    # channel that did not update — worth a red job — but it must not fail the
    # release run, which by this point has already published the GitHub release
    # every other channel is served from. Nothing depends on this job, so its
    # failure cannot re-draft the release.
    continue-on-error: true
    permissions:
      # Reads the release's sha256sums.txt; the bucket push uses a PAT, not this
      # token, so the job never needs write access to this repository.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Update the bucket manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same PAT the Homebrew tap step uses; its access covers
          # Goldziher/scoop-bucket as well, so there is one credential and one
          # pattern in this workflow rather than two.
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"

          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so Goldziher/scoop-bucket cannot be updated." >&2
            echo "The bucket will otherwise keep serving the previous release indefinitely." >&2
            exit 1
          fi

          # The hash comes from the release's own sha256sums.txt. Recomputing it
          # from a locally downloaded copy would normally agree, but it is the one
          # place the bucket and the published archive could come to disagree.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'sha256sums.txt' --dir sums --clobber

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/scoop-bucket.git" bucket
          ./scripts/update-scoop-manifest.sh "$version" sums/sha256sums.txt bucket/bucket/poly.json "$GITHUB_REPOSITORY" > poly.json
          cp poly.json bucket/bucket/poly.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/poly.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "poly ${version}"
            git push
          fi

  publish_npm:
    name: Publish npm (@goldziher/polylint)
    needs: [meta, finalize_release]
    # Gated on finalize_release because the packages carry the release archives'
    # binaries: publishing before the release is live would ship bytes nobody can
    # verify against sha256sums.txt. Gated on npm_bootstrapped because a package
    # npm has never seen cannot have a trusted publisher, so there is nothing
    # this job could succeed at — skipping with a notice is more honest than
    # failing. Publishing is token-less: OIDC only, no NODE_AUTH_TOKEN.
    if: needs.finalize_release.result == 'success' && needs.meta.outputs.npm_bootstrapped == 'true'
    runs-on: ubuntu-latest
    # Non-blocking, same reasoning as publish_scoop: a not-yet-configured trusted
    # publisher must show up as a failed job, not as a failed release. The
    # GitHub release is already published and un-drafted before this job starts,
    # and nothing depends on it, so it cannot undo that.
    continue-on-error: true
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a publish
      # credential. No NODE_AUTH_TOKEN is set anywhere in this job.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          # Fetch what is attached to the release rather than rebuilding, so the
          # binaries inside the npm packages are byte-identical to the archives
          # sha256sums.txt describes. A separate build would drift silently.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          # sha256sums.txt was generated from `find .`, so its paths carry a ./
          # prefix that `sha256sum -c` resolves relative to this directory.
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Stage the release binaries into the platform packages
        run: ./npm-package/stage-binaries.sh --artifacts artifacts

      - name: Publish to npm
        run: |
          set -euo pipefail
          # npm's OIDC trusted publishing (token-less registry auth) needs
          # npm >= 11.5.1; the bundled npm on the setup-node image lags. Without
          # the upgrade npm still signs provenance but publishes unauthenticated
          # and the registry rejects the PUT.
          npm install -g npm@latest
          npm --version

          version="${{ needs.meta.outputs.version }}"
          # A real release claims `latest`. The 0.0.0 bootstrap publish sits under
          # a `placeholder` dist-tag precisely so it never becomes what
          # `npm install @goldziher/polylint` resolves to; nothing here should
          # carry that tag forward.
          case "$version" in
            *-rc.* | *-beta* | *-alpha*) npm_tag="next" ;;
            *) npm_tag="latest" ;;
          esac

          publish_one() {
            local dir="$1"
            local name
            name="$(jq -r '.name' "$dir/package.json")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "· ${name}@${version} is already published; skipping"
              return 0
            fi
            echo "→ publishing ${name}@${version} (--tag ${npm_tag})"
            # --provenance attaches a signed build-provenance attestation using
            # the job's id-token.
            ( cd "$dir" && npm publish --provenance --access public --tag "$npm_tag" )
          }

          # Platform packages first, and `set -e` means a failed one aborts the
          # step before the umbrella is published. That ordering is what keeps a
          # partial failure from producing the worst outcome: an umbrella package
          # on `latest` whose pinned binaries do not exist, which installs
          # cleanly and then has no `poly` to run.
          for dir in npm-package/platforms/*/; do
            publish_one "${dir%/}"
          done
          publish_one npm-package

  publish_pypi:
    name: Publish PyPI (polylint)
    needs: [meta, finalize_release]
    # Same gating as npm: the wheels embed the release archives' binaries, so the
    # release has to be live first. PyPI `polylint` already exists, so the only
    # per-version guard needed is "not already published".
    if: needs.finalize_release.result == 'success' && needs.meta.outputs.pypi_exists != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    # PyPI's trusted publisher for this project names this environment; the two
    # must agree or the OIDC exchange is refused.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Build the platform wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          python pip-package/build_wheels.py --artifacts artifacts --out pip-package/dist
          ls -l pip-package/dist

      - name: Publish to PyPI
        # Trusted publishing (OIDC) — no API token. skip-existing keeps a re-run
        # of a partially uploaded release from failing on the files that landed.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  update_major_tag:
    name: Move the major version tag
    needs: [meta, finalize_release]
    if: needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Move major tag to this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          major="v${version%%.*}"
          sha="$(git rev-list -n1 "$tag")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$sha"
          git push -f origin "refs/tags/${major}"
          echo "Moved ${major} → ${tag} (${sha})"
