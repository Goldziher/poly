name: Publish Packages

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      plugins-only:
        description: "Publish current main plugin packages only; skip existing versions"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish (e.g., v0.1.0)"
        required: false
        type: string
      rebuild_components:
        description: "Rebuild every component instead of reusing the previous release's unchanged assets"
        type: boolean
        default: false

# Component signing: the build-components jobs sign each archive with the Ed25519 private key in the
# repository secret POLY_COMPONENT_SIGNING_KEY (PKCS#8 PEM, or base64 of the PKCS#8 DER or a raw
# 32-byte seed). Its public half is `poly-release-1` in alef.toml
# ([crates.component_distribution.public_keys]); rotate by adding a second key id there and changing
# KEY_ID in mise-tasks/components/release.sh. A missing secret fails the release.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level: only `contents: write`, which the
# release-asset steps need. The npm and PyPI jobs additionally request
# `id-token: write` on themselves, because trusted publishing (OIDC) mints its
# token from that claim — granting it to every job would hand the whole matrix a
# credential that can publish packages.
permissions:
  contents: write

jobs:
  plugin-meta:
    name: Verify plugin-only dispatch metadata
    if: inputs.plugins-only
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Read consistent current plugin versions
        id: version
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          if os.environ['DISPATCH_REF'] != 'refs/heads/main':
              raise SystemExit('Plugin-only publishing requires main')
          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          core = cargo.get('workspace', {}).get('package', cargo.get('package', {}))['version']
          npm = json.loads(Path('plugin/package.json').read_text())['version']
          hermes = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']['version']
          if not core or core != npm or core != hermes:
              raise SystemExit(f'Plugin versions disagree: core={core}, npm={npm}, Hermes={hermes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={core}\n')
          PY

  meta:
    if: ${{ !inputs.plugins-only }}
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_assets_exist: ${{ steps.release_assets.outputs.release_assets_exist }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "Git tag: $tag"
          echo "Cargo version: $version"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          target_version="${{ steps.version.outputs.version }}"

          echo "Verifying version consistency for: $target_version"

          # Check Cargo.toml workspace version
          cargo_version="$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "$target_version" ]; then
            echo "::error::Cargo.toml version mismatch: expected $target_version, got $cargo_version"
            exit 1
          fi

          # The components workspace versions the musl bundled binary and every component archive.
          components_version="$(grep -E '^version = "' components/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$components_version" != "$target_version" ]; then
            echo "::error::components/Cargo.toml version mismatch: expected $target_version, got $components_version"
            exit 1
          fi

          # The pyrefly workspace is built separately (jemalloc 0.7 cannot share a lockfile with components/).
          pyrefly_version="$(grep -E '^version = "' components-pyrefly/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$pyrefly_version" != "$target_version" ]; then
            echo "::error::components-pyrefly/Cargo.toml version mismatch: expected $target_version, got $pyrefly_version"
            exit 1
          fi

          plugin_version="$(jq -r '.version' plugin/package.json)"
          if [ "$plugin_version" != "$target_version" ]; then
            echo "::error::Agent plugin version mismatch: expected $target_version, got $plugin_version"
            exit 1
          fi

          # The wrapper packages ship in lock-step (mise run release:bump moves
          # them with Cargo.toml). Check them here too: a package publishing the
          # wrong version is not recoverable — npm and PyPI both refuse to
          # overwrite a released version.
          npm_version="$(jq -r '.version' npm-package/package.json)"
          if [ "$npm_version" != "$target_version" ]; then
            echo "::error::npm-package/package.json version mismatch: expected $target_version, got $npm_version"
            exit 1
          fi

          for manifest in npm-package/platforms/*/package.json; do
            platform_version="$(jq -r '.version' "$manifest")"
            if [ "$platform_version" != "$target_version" ]; then
              echo "::error::$manifest version mismatch: expected $target_version, got $platform_version"
              exit 1
            fi
          done

          # The main package pins its platform packages exactly; a stale pin here
          # resolves to the previous release's binary under the new version.
          while read -r pinned; do
            if [ "$pinned" != "$target_version" ]; then
              echo "::error::npm-package/package.json optionalDependencies pin mismatch: expected $target_version, got $pinned"
              exit 1
            fi
          done < <(jq -r '.optionalDependencies[]' npm-package/package.json)

          pypi_version="$(grep -E '^version = "' pip-package/pyproject.toml | head -1 | cut -d'"' -f2)"
          if [ "$pypi_version" != "$target_version" ]; then
            echo "::error::pip-package/pyproject.toml version mismatch: expected $target_version, got $pypi_version"
            exit 1
          fi

          init_version="$(grep -E '^__version__ = "' pip-package/polylint/__init__.py | cut -d'"' -f2)"
          if [ "$init_version" != "$target_version" ]; then
            echo "::error::pip-package/polylint/__init__.py version mismatch: expected $target_version, got $init_version"
            exit 1
          fi

          echo "✓ Version verified across Cargo + npm + PyPI: $cargo_version"

      - name: Detect existing GitHub release assets
        id: release_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          release_assets_exist=false

          # Complete means sha256sums.txt is uploaded, which happens only after every binary is. A
          # draft left with partial assets by a failed run must be rebuilt, not skipped.
          if gh release view "$tag" >/dev/null 2>&1 &&
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'sha256sums.txt'; then
            release_assets_exist=true
          fi

          echo "release_assets_exist=$release_assets_exist" >> "$GITHUB_OUTPUT"
          echo "GitHub release assets exist? $release_assets_exist"

  create_release:
    name: Create GitHub release
    needs: meta
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Ensure the GitHub release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            # A pre-existing release can be live but incomplete — a re-run, a
            # tag pushed twice, or a release created outside this workflow. In
            # that state it is what /releases/latest resolves to, so every
            # consumer's installer picks it up and then fails the checksum
            # verification, because sha256sums.txt is not uploaded until the
            # whole build matrix finishes. Put it back into draft until
            # finalize_release has verified the full asset set. A release that
            # already carries sha256sums.txt is complete and is left alone.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q '.isDraft')" != "true" ] &&
              ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                grep -qx 'sha256sums.txt'; then
              echo "::warning::release $tag is published but has no sha256sums.txt; reverting to draft until its assets are complete"
              gh release edit "$tag" --draft=true --repo "$GITHUB_REPOSITORY"
            fi
          else
            prerelease=""
            case "$tag" in
              *-rc.* | *-beta* | *-alpha*) prerelease="--prerelease" ;;
            esac
            # Create as a DRAFT. The build matrix uploads binaries to it, but it
            # stays invisible (assets not publicly downloadable) until the
            # finalize_release job promotes it — and that job only runs once
            # checksums (which requires all platform binaries) succeeds. A failed
            # platform build therefore leaves a hidden draft, not a live release
            # with missing binaries and no checksums.
            gh release create "$tag" --title "$tag" --notes "Release $tag" --verify-tag --draft $prerelease
          fi

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      # Fetched once so every build leg plans against, and the lock reuses from, the same lock.
      - name: Fetch the previous release's component lock
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD_COMPONENTS: ${{ github.event.inputs.rebuild_components || 'false' }}
        run: mise run components:release previous-lock

      - name: Save the previous component lock
        uses: actions/upload-artifact@v7
        with:
          name: component-previous-lock
          path: target/components-release/previous-lock.json
          if-no-files-found: error

  build-components:
    name: Build components / ${{ matrix.triple }}
    needs: [meta, create_release]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Part of each component's input hash, so a new image rebuilds instead of reusing. Empty
      # for the native builds.
      BUILD_IMAGE: ${{ matrix.image }}
      # One exact toolchain for every component build: the host setup, the manylinux container's
      # rustup and the input hash all use this value. Bump it deliberately; it rebuilds everything.
      RUST_TOOLCHAIN: "1.99.1"
      REBUILD_COMPONENTS: ${{ github.event.inputs.rebuild_components || 'false' }}
    strategy:
      fail-fast: false
      # musl is absent on purpose: that binary is fully bundled and downloads no component.
      matrix:
        include:
          # glibc is the floor the components' symbols are linked against, so the gnu builds run in
          # a pinned manylinux_2_28 image rather than on the runner's newer glibc. Bump the tag and
          # digest together.
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.11.01-2@sha256:54b271d9562a3686298880df05367909e949ed317e7b1b79b59c696d75f78676
          - triple: x86_64-apple-darwin
            os: macos-26-intel
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.triple }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: components-${{ matrix.triple }}

      # go builds the sh component, an executable producer (alef.toml); the manylinux containers get it by mount.
      - name: Setup mise (alef, go)
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: github:xberg-io/alef go

      - name: Download the previous component lock
        uses: actions/download-artifact@v8
        with:
          name: component-previous-lock
          path: target/components-release

      # The musl alef and the musl mise are fetched and checksum-verified here, on the host, and
      # reached through the /work mount. The container has an old glibc and no mise, so it runs the
      # same `mise run components:release` task with the static binary and installs no tools
      # (MISE_TASK_RUN_AUTO_INSTALL=false): alef comes from ALEF, cargo and rustc from rustup. The
      # signing key reaches only the package container; rustup, plan and build run in one without
      # it. Both containers share image, mounts and environment, so the package step recomputes the
      # fingerprint the plan recorded.
      - name: Fetch alef and mise for the manylinux_2_28 container
        if: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          alef="$(mise run components:release fetch-alef)"
          mise_bin="$(mise run components:release fetch-mise)"
          jq_bin="$(mise run components:release fetch-jq)"
          {
            echo "ALEF_IN_CONTAINER=/work/${alef#"$PWD"/}"
            echo "MISE_IN_CONTAINER=/work/${mise_bin#"$PWD"/}"
            echo "JQ_IN_CONTAINER=/work/${jq_bin#"$PWD"/}"
            echo "GOROOT_ON_HOST=$(go env GOROOT)"
          } >> "$GITHUB_ENV"

      # rustup installs into CARGO_HOME/RUSTUP_HOME under the workspace, in the keyless container;
      # the package container reuses them offline. Both get the same paths.
      - name: Plan and build components (manylinux_2_28 container)
        if: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -v "$GOROOT_ON_HOST":/opt/go:ro -w /work \
            -e TARGET="${{ matrix.triple }}" -e RUST_TOOLCHAIN -e BUILD_IMAGE -e ALEF="$ALEF_IN_CONTAINER" \
            -e MISE_IN_CONTAINER -e JQ_IN_CONTAINER -e MISE_TASK_RUN_AUTO_INSTALL=false -e MISE_AUTO_INSTALL=false -e MISE_YES=1 \
            -e MISE_TRUSTED_CONFIG_PATHS=/work \
            -e CARGO_HOME=/work/target/components-release/toolchain/cargo \
            -e RUSTUP_HOME=/work/target/components-release/toolchain/rustup \
            -e GOTOOLCHAIN=local -e GOFLAGS=-modcacherw \
            -e GOPATH=/work/target/components-release/toolchain/gopath \
            -e GOCACHE=/work/target/components-release/toolchain/gocache \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "${{ matrix.image }}" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --target "$TARGET"
              export PATH="$CARGO_HOME/bin:/opt/go/bin:$(dirname "$MISE_IN_CONTAINER"):$(dirname "$JQ_IN_CONTAINER"):$PATH"
              mise run components:release plan "$TARGET"
              mise run components:release build "$TARGET"
              chown -R "$HOST_UID:$HOST_GID" target
            '

      # No network and no installer here: the key is a read-only 0600 file, exported for the one
      # package command only.
      - name: Write the signing key file
        if: ${{ matrix.image }}
        shell: bash
        env:
          POLY_COMPONENT_SIGNING_KEY: ${{ secrets.POLY_COMPONENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$POLY_COMPONENT_SIGNING_KEY" > "$RUNNER_TEMP/poly-key"

      - name: Sign and package components (manylinux_2_28 container)
        if: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -v "$GOROOT_ON_HOST":/opt/go:ro -v "$RUNNER_TEMP/poly-key":/run/poly-key:ro -w /work \
            -e TARGET="${{ matrix.triple }}" -e RUST_TOOLCHAIN -e BUILD_IMAGE -e ALEF="$ALEF_IN_CONTAINER" \
            -e MISE_IN_CONTAINER -e JQ_IN_CONTAINER -e MISE_TASK_RUN_AUTO_INSTALL=false -e MISE_AUTO_INSTALL=false -e MISE_YES=1 \
            -e MISE_TRUSTED_CONFIG_PATHS=/work \
            -e CARGO_HOME=/work/target/components-release/toolchain/cargo \
            -e RUSTUP_HOME=/work/target/components-release/toolchain/rustup \
            -e GOTOOLCHAIN=local -e GOFLAGS=-modcacherw \
            -e GOPATH=/work/target/components-release/toolchain/gopath \
            -e GOCACHE=/work/target/components-release/toolchain/gocache \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "${{ matrix.image }}" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              export PATH="$CARGO_HOME/bin:/opt/go/bin:$(dirname "$MISE_IN_CONTAINER"):$(dirname "$JQ_IN_CONTAINER"):$PATH"
              POLY_COMPONENT_SIGNING_KEY="$(cat /run/poly-key)" mise run components:release package "$TARGET"
              chown -R "$HOST_UID:$HOST_GID" target
            '

      - name: Remove the signing key file
        if: ${{ always() && matrix.image }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/poly-key"

      - name: Plan components (input hashes, reuse against the previous lock)
        if: ${{ !matrix.image }}
        shell: bash
        run: mise run components:release plan "${{ matrix.triple }}"

      - name: Build components
        if: ${{ !matrix.image }}
        shell: bash
        run: mise run components:release build "${{ matrix.triple }}"

      - name: Sign and package components
        if: ${{ !matrix.image }}
        shell: bash
        env:
          POLY_COMPONENT_SIGNING_KEY: ${{ secrets.POLY_COMPONENT_SIGNING_KEY }}
        run: mise run components:release package "${{ matrix.triple }}"

      - name: Upload component assets to the release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(target/components-release/${{ matrix.triple }}/dist/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "every component for ${{ matrix.triple }} is reused; nothing to upload"
          else
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          fi

      - name: Save artifact for the lock and checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-components-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/dist/*
          # Empty when the plan reuses every component for this triple.
          if-no-files-found: ignore

      - name: Save the plan for the lock
        uses: actions/upload-artifact@v7
        with:
          name: component-plan-${{ matrix.triple }}
          path: target/components-release/${{ matrix.triple }}/plan/plan.json
          if-no-files-found: error

  component-lock:
    name: Merge the component lock
    needs: [meta, build-components]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup mise (alef)
        uses: xberg-io/actions/setup-mise@v1

      - name: Download every triple's built component assets
        # Absent when the plan reuses every component on every triple.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: releases-components-*
          merge-multiple: true
          path: components

      - name: Download every triple's plan
        uses: actions/download-artifact@v8
        with:
          pattern: component-plan-*
          path: plans

      - name: Download the previous component lock
        uses: actions/download-artifact@v8
        with:
          name: component-previous-lock
          path: target/components-release

      - name: Merge into one signed lock (reused entries carried over)
        run: mise run components:release lock plans components poly-components.lock.json

      - name: Assert the lock is complete and signed
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          REBUILD_COMPONENTS: ${{ github.event.inputs.rebuild_components || 'false' }}
        run: |
          set -euo pipefail
          plan=target/components-release/plan.json
          total="$(jq '.rows | length' "$plan")"
          to_build="$(jq '[.rows[] | select(.action == "build")] | length' "$plan")"
          # Every configured component on every configured target, so a triple or component that
          # silently dropped out of the matrix or the plan fails here rather than at a user's first run.
          expected="$(python3 -c 'import tomllib; d = tomllib.load(open("alef.toml", "rb")); print(sum(len(c.get("targets", [])) for crate in d["crates"] for c in crate.get("components", [])))')"
          [ "$total" -gt 0 ] && [ "$total" -eq "$expected" ] || {
            echo "::error::the merged plan has $total rows; alef.toml configures $expected component builds"
            exit 1
          }
          [ "$REBUILD_COMPONENTS" != "true" ] || [ "$to_build" -eq "$total" ] || {
            echo "::error::rebuild requested but the plan reuses $((total - to_build)) of $total components"
            exit 1
          }
          prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/"
          jq -e --argjson total "$total" --argjson built "$to_build" --arg prefix "$prefix" --arg tag_prefix "${prefix}${RELEASE_TAG}/" '
            (.artifacts | length) == $total
            and ([.artifacts[] | select(.url | startswith($tag_prefix))] | length) == $built
            and ((.public_keys | keys) == ["poly-release-1"])
            and all(.artifacts[]; .key_id == "poly-release-1" and (.url | startswith($prefix)))
          ' poly-components.lock.json >/dev/null || {
            echo "::error::component lock is incomplete, unsigned, or does not match the plan ($total entries, $to_build built for $RELEASE_TAG)"
            jq '{keys: (.public_keys | keys), artifacts: [.artifacts[] | {c: .identity.component, t: .identity.target, key: .key_id, url}]}' poly-components.lock.json
            exit 1
          }
          echo "lock carries $total signed artifacts ($to_build built for $RELEASE_TAG, $((total - to_build)) reused)"

      - name: Upload the lock to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" poly-components.lock.json --clobber

      - name: Save the lock for the core builds and checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-components-lock
          path: poly-components.lock.json
          if-no-files-found: error

  build-binaries:
    name: Build binaries / ${{ matrix.triple }}
    # The component lock is embedded in every build that downloads components (all but musl).
    needs: [meta, create_release, component-lock]
    if: >-
      !inputs.plugins-only && (needs.meta.outputs.release_assets_exist != 'true')
    runs-on: ${{ matrix.os }}
    # Stamp the build id from the tag we are releasing rather than leaving
    # build.rs to infer it from `git describe`. The release also force-moves the
    # `v0` major tag onto this commit, so a later workflow_dispatch re-run — the
    # only path that rebuilds — can have `git describe` resolve `v0`, whose
    # stripped form is "0" rather than the version, silently stamping a release
    # artifact as a `dev` build. An explicit id is what build.rs documents this
    # variable for.
    env:
      POLY_BUILD_ID: ${{ needs.meta.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - triple: x86_64-unknown-linux-musl
            os: ubuntu-latest
            alpine: true
          - triple: x86_64-apple-darwin
            os: macos-26-intel
          - triple: aarch64-apple-darwin
            os: macos-26
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"

      - name: Name the directory the binary is built into
        # The core is built with `--profile core` (target/<triple>/core); the musl bundled build
        # keeps the release profile.
        run: echo "PROFILE_DIR=${{ matrix.alpine && 'release' || 'core' }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Setup Rust
        if: ${{ !matrix.alpine }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - name: Setup cache
        if: ${{ !matrix.alpine }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install clang for bindgen (Linux)
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
        shell: bash

      - name: Download the component lock
        uses: actions/download-artifact@v8
        with:
          name: releases-components-lock
          path: components-lock

      - name: Build binary (native, component lock embedded)
        if: ${{ !matrix.alpine }}
        env:
          # Read by crates/poly-core/build.rs and compiled into the binary.
          POLY_COMPONENT_LOCK_FILE: ${{ github.workspace }}/components-lock/poly-components.lock.json
        # The core flavour (ADR 0039): every other engine family and the MCP server are components
        # this binary downloads on first use, from the lock embedded above.
        run: cargo build --profile core --locked --target ${{ matrix.triple }} -p poly-cli --no-default-features --features core
        shell: bash

      - name: Build binary (musl, Alpine container)
        if: ${{ matrix.alpine }}
        run: |
          # Build host-native inside rust:alpine (the image's host target already
          # IS x86_64-unknown-linux-musl). NOT `--target`: with an explicit target
          # Cargo applies RUSTFLAGS only to the target, leaving build scripts
          # static-musl — and ruby-prism-sys's bindgen build script must be
          # dynamically linked (-crt-static off) to dlopen libclang. Building
          # host-native applies the flag everywhere. Then place the binary at the
          # triple path the shared packaging step expects. The musl build is the poly-bundled crate
          # of the components/ workspace (every engine statically linked, including the git-pinned
          # oxc, biome and rubyfmt ones) and is given no POLY_COMPONENT_LOCK_FILE, so it embeds no
          # lock and downloads nothing. CARGO_TARGET_DIR puts its output at target/release/poly.
          docker run --rm -v "$PWD":/work -v "$GOROOT_ON_HOST":/opt/go:ro -w /work \
            -e CARGO_TARGET_DIR=/work/target \
            -e LIBCLANG_PATH=/usr/lib \
            -e POLY_BUILD_ID="$POLY_BUILD_ID" \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            rust:alpine sh -c '
              set -e
              apk add --no-cache build-base musl-dev clang clang-dev llvm-dev pkgconf git perl
              cargo build --release --locked --manifest-path components/Cargo.toml -p poly-bundled
              mkdir -p "target/${{ matrix.triple }}/release"
              cp target/release/poly "target/${{ matrix.triple }}/release/poly"
              strip "target/${{ matrix.triple }}/release/poly"
            '
        shell: bash

      - name: Strip binary
        if: ${{ !matrix.alpine }}
        run: |
          case "${{ matrix.triple }}" in
            *windows*)
              # Windows binaries don't benefit from strip
              ;;
            *)
              strip target/${{ matrix.triple }}/$PROFILE_DIR/poly || true
              ;;
          esac
        shell: bash

      - name: Assert the binary was built without dev-lock
        # The `dev-lock` feature is the only code that names POLY_COMPONENT_DEV_LOCK, so the name
        # appearing in the binary means a development lock path is compiled into the release.
        # Reading the artifact (not the cargo invocation or `cargo tree`) covers every way the
        # feature could be switched on, and needs no execution, so it also works for the musl
        # build made in a container and for cross-built targets.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          test -s "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          if grep -aq POLY_COMPONENT_DEV_LOCK "$bin"; then
            echo "::error::$bin was built with the dev-lock feature"
            exit 1
          fi
          echo "dev-lock absent from $bin"
        shell: bash

      - name: Assert the core is under 14 MiB
        # The ceiling is for the shipped binary, lock included, on the largest native triple.
        if: ${{ matrix.triple == 'x86_64-unknown-linux-gnu' }}
        run: |
          set -euo pipefail
          size="$(wc -c < "target/${{ matrix.triple }}/$PROFILE_DIR/poly" | tr -d ' ')"
          echo "core binary: $size bytes"
          [ "$size" -gt 1000000 ] && [ "$size" -le 14680064 ] || { echo "::error::the core binary is $size bytes, outside 1 MB..14 MiB"; exit 1; }
        shell: bash

      - name: Assert the component lock is embedded (absent for musl)
        # The lock's URLs are string data in the binary only when build.rs embedded the lock, so
        # reading the artifact shows what the build actually carries. The binary path is the one
        # the build steps above produce: the musl container copies target/release/poly to it.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          test -s "$bin" || { echo "::error::no binary at $bin"; exit 1; }
          lock=components-lock/poly-components.lock.json
          total="$(jq -er '.artifacts | length' "$lock")"
          [ "$total" -gt 0 ] || { echo "::error::the component lock lists no artifacts"; exit 1; }
          found=0
          # jq.exe on Windows ends lines in CRLF; a URL keeping its \r matches nothing in the binary.
          while IFS= read -r url; do
            url="${url%$'\r'}"
            if grep -aqF "$url" "$bin"; then found=$((found + 1)); fi
          done < <(jq -er '.artifacts[].url' "$lock")
          if [ "${{ matrix.alpine }}" = "true" ]; then
            [ "$found" -eq 0 ] || { echo "::error::the musl binary embeds $found of $total component artifact URLs"; exit 1; }
            echo "no component lock in $bin (0 of $total URLs)"
          else
            [ "$found" -eq "$total" ] || { echo "::error::$bin embeds $found of $total component artifact URLs"; exit 1; }
            echo "component lock embedded in $bin ($found of $total URLs)"
          fi
        shell: bash

      - name: Smoke-test the core binary against this release's components
        # Runs the binary users get: it installs every component of its triple through the embedded,
        # signed lock (assets fetched from the draft release into a localhost mirror, so each lock
        # URL keeps its path) and lints and formats one file per component language. A wrong signing
        # key, a component that does not load, or an engine that errors fails the release here.
        if: ${{ matrix.alpine != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin="$PWD/target/${{ matrix.triple }}/$PROFILE_DIR/poly"
          case "${{ matrix.triple }}" in *windows*) bin="$bin.exe" ;; esac
          lock=components-lock/poly-components.lock.json
          mirror="$RUNNER_TEMP/component-mirror"
          rows=0
          while IFS= read -r url; do
            url="${url%$'\r'}"
            path="${url#https://github.com/}"
            tag="$(echo "$path" | cut -d/ -f5)"
            dir="$mirror/$(dirname "$path")"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$path")" --dir "$dir" --clobber
            rows=$((rows + 1))
          done < <(jq -er --arg t "${{ matrix.triple }}" '.artifacts[] | select(.identity.target == $t) | .url' "$lock")
          [ "$rows" -gt 0 ] || { echo "::error::the lock has no components for ${{ matrix.triple }}"; exit 1; }
          py="$(command -v python3 || command -v python)"
          (cd "$mirror" && "$py" -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          export POLY_COMPONENT_MIRROR=http://127.0.0.1:8765 POLY_COMPONENT_CACHE="$RUNNER_TEMP/component-cache"
          "$bin" components install all
          fixture="$RUNNER_TEMP/smoke"
          mkdir -p "$fixture"
          printf 'import os\n' > "$fixture/a.py"
          printf 'const a = 1;\n' > "$fixture/a.ts"
          printf 'select 1\n' > "$fixture/a.sql"
          printf '<?php\necho 1;\n' > "$fixture/a.php"
          printf '{ a = 1; }\n' > "$fixture/a.nix"
          printf 'puts 1\n' > "$fixture/a.rb"
          printf 'a { color: red; }\n' > "$fixture/a.css"
          printf 'query { a }\n' > "$fixture/a.graphql"
          printf 'FROM alpine\n' > "$fixture/Dockerfile"
          printf 'a = 1\n' > "$fixture/a.toml"
          printf '# a\n' > "$fixture/a.md"
          printf '[a]\nk = 1\n' > "$fixture/a.ini"
          files="$(find "$fixture" -type f | wc -l | tr -d ' ')"
          for mode in lint fmt; do
            set +e
            if [ "$mode" = lint ]; then
              "$bin" lint --workspace never --no-cache --format json "$fixture" > "$RUNNER_TEMP/$mode.json"
            else
              "$bin" fmt --no-cache --format json "$fixture" > "$RUNNER_TEMP/$mode.json"
            fi
            code=$?
            set -e
            [ "$code" -le 1 ] || { cat "$RUNNER_TEMP/$mode.json"; echo "::error::poly $mode exited $code"; exit 1; }
            # Lint skips a.nix (alejandra formats only); every other file must be checked, none errored.
            jq -e --argjson n "$files" --arg mode "$mode" '
              .summary.errored == 0 and (.errors | length) == 0
              and (if $mode == "lint" then .summary.checked + .summary.skipped == $n else .summary.checked == $n end)' \
              "$RUNNER_TEMP/$mode.json" > /dev/null || { cat "$RUNNER_TEMP/$mode.json"; echo "::error::poly $mode did not check all $files files cleanly"; exit 1; }
            echo "poly $mode: $(jq -c .summary "$RUNNER_TEMP/$mode.json")"
          done
          # uncomment is opt-in and outside the `all` preset: install it, enable it, and require a diagnostic.
          "$bin" components install uncomment
          uncomment_dir="$RUNNER_TEMP/smoke-uncomment"
          mkdir -p "$uncomment_dir"
          # code_only = false: the default flags only commented-out code, and this also proves a bool key reaches the component.
          printf '[lint.uncomment]\nenabled = true\ncode_only = false\n' > "$uncomment_dir/poly.toml"
          printf 'x = 1\n# a removable comment\n' > "$uncomment_dir/a.py"
          set +e
          "$bin" lint --workspace never --no-cache --only uncomment --format json "$uncomment_dir" > "$RUNNER_TEMP/uncomment.json"
          code=$?
          set -e
          [ "$code" -le 1 ] || { cat "$RUNNER_TEMP/uncomment.json"; echo "::error::poly lint (uncomment) exited $code"; exit 1; }
          jq -e '.summary.errored == 0 and ([.results[].diagnostics[] | select(.engine == "uncomment")] | length) > 0' \
            "$RUNNER_TEMP/uncomment.json" > /dev/null || { cat "$RUNNER_TEMP/uncomment.json"; echo "::error::the uncomment component reported nothing"; exit 1; }
          echo "poly lint (uncomment): $(jq -c .summary "$RUNNER_TEMP/uncomment.json")"
        shell: bash

      - name: Create release artifacts
        run: |
          cd target/${{ matrix.triple }}/$PROFILE_DIR

          case "${{ matrix.triple }}" in
            *windows*)
              7z a ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip poly.exe
              ;;
            *)
              tar czf ../../../poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz poly
              ;;
          esac
        shell: bash

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"

          case "${{ matrix.triple }}" in
            *windows*)
              archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip"
              ;;
            *)
              archive="poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz"
              ;;
          esac

          if [ ! -f "$archive" ]; then
            echo "::error::Archive not found: $archive"
            exit 1
          fi

          gh release upload "$tag" "$archive" --clobber
        shell: bash

      - name: Save artifact for checksums
        uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.triple }}
          path: |
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.tar.gz
            poly-${{ needs.meta.outputs.version }}-${{ matrix.triple }}.zip
          if-no-files-found: ignore

  checksums:
    if: ${{ !inputs.plugins-only }}
    name: Generate and upload checksums
    needs: [meta, build-binaries, build-components, component-lock]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: releases-*
          merge-multiple: true
          path: artifacts

      - name: Verify all expected archives are present
        run: |
          set -euo pipefail

          # Expected archives for the 6 build targets
          expected=(
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-apple-darwin.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-aarch64-apple-darwin.tar.gz"
            "poly-${{ needs.meta.outputs.version }}-x86_64-pc-windows-msvc.zip"
          )

          missing_count=0
          for expected_asset in "${expected[@]}"; do
            if [ ! -f "artifacts/$expected_asset" ]; then
              echo "::error::Missing expected archive: $expected_asset"
              missing_count=$((missing_count + 1))
            fi
          done

          if [ $missing_count -gt 0 ]; then
            echo "::error::Release is incomplete: $missing_count of 6 platform archives missing. The release must have all 6 binaries before checksums can be generated."
            exit 1
          fi

          echo "✓ All 6 expected archives present"

      - name: Verify every component asset is present
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          [ -f artifacts/poly-components.lock.json ] || {
            echo "::error::missing poly-components.lock.json"
            exit 1
          }
          # An entry reused from an earlier release points at that release's asset. Every other
          # entry was built for this tag and must have its archive and record uploaded here.
          local_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          built=0
          total="$(jq '.artifacts | length' artifacts/poly-components.lock.json)"
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            built=$((built + 1))
            archive="${url#"$local_prefix"}"
            for asset in "$archive" "$archive.record.json"; do
              [ -f "artifacts/$asset" ] || {
                echo "::error::missing component asset: $asset"
                missing=$((missing + 1))
              }
            done
          done < <(jq -r --arg prefix "$local_prefix" '.artifacts[] | select(.url | startswith($prefix)) | .url' artifacts/poly-components.lock.json)
          [ "$total" -gt 0 ] || {
            echo "::error::the component lock has no artifacts"
            exit 1
          }
          # An entry reused from an earlier release must still be there: ask that release for its
          # asset list rather than fetching the URL.
          reused=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            reused=$((reused + 1))
            rest="${url#"https://github.com/${GITHUB_REPOSITORY}/releases/download/"}"
            old_tag="${rest%%/*}"
            asset="${rest#*/}"
            if ! gh release view "$old_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$asset"; then
              echo "::error::reused component asset $asset is gone from release $old_tag"
              missing=$((missing + 1))
            fi
          done < <(jq -r --arg prefix "$local_prefix" '.artifacts[] | select((.url | startswith($prefix)) | not) | .url' artifacts/poly-components.lock.json)
          [ $((built + reused)) -eq "$total" ] || {
            echo "::error::lock has $total artifacts but $built are built here and $reused reused"
            exit 1
          }
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ the lock has $total component artifacts, $built built for $RELEASE_TAG with their assets present, $((total - built)) reused"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          # Core and component archives, component records, and the lock. Every
          # name starts with poly-, which is the pattern the registry jobs download and check.
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.record.json" \
            -o -name "poly-components.lock.json" \) -exec sha256sum {} \; | sort > ../sha256sums.txt
          cat ../sha256sums.txt

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          gh release upload "$tag" sha256sums.txt --clobber

  finalize_release:
    name: Publish GitHub release
    needs: [meta, checksums]
    if: >-
      !inputs.plugins-only && (always() && needs.meta.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Promote draft to published release once complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          version="${{ needs.meta.outputs.version }}"

          # The full asset set the installer needs: every platform archive plus
          # the checksums file they verify against.
          required=(
            "poly-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "poly-${version}-x86_64-unknown-linux-musl.tar.gz"
            "poly-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "poly-${version}-x86_64-apple-darwin.tar.gz"
            "poly-${version}-aarch64-apple-darwin.tar.gz"
            "poly-${version}-x86_64-pc-windows-msvc.zip"
            "poly-components.lock.json"
            "sha256sums.txt"
          )

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            > /tmp/assets.txt || true
          missing=0
          for asset in "${required[@]}"; do
            if ! grep -qx "$asset" /tmp/assets.txt; then
              echo "::error::release $tag is missing $asset"
              missing=$((missing + 1))
            fi
          done
          # Every component the lock points at this tag was built for it and needs its archive and
          # record here; entries reused from an earlier release point at that release instead.
          scratch="$(mktemp -d)"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern poly-components.lock.json --dir "$scratch"; then
            prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
            total="$(jq '.artifacts | length' "$scratch/poly-components.lock.json")"
            if [ "$total" -eq 0 ]; then
              echo "::error::the release's component lock has no artifacts"
              missing=$((missing + 1))
            fi
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              archive="${url#"$prefix"}"
              for asset in "$archive" "$archive.record.json"; do
                if ! grep -qx "$asset" /tmp/assets.txt; then
                  echo "::error::release $tag is missing component asset $asset"
                  missing=$((missing + 1))
                fi
              done
            done < <(jq -r --arg prefix "$prefix" '.artifacts[] | select(.url | startswith($prefix)) | .url' "$scratch/poly-components.lock.json")
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::error::release $tag is incomplete ($missing required assets missing); leaving it as a draft"
            exit 1
          fi

          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "✓ Promoted $tag to a published release"

  publish_homebrew:
    name: Update Homebrew formula
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      - name: Update tap formula
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fail rather than skip. This step used to exit 0 on a missing token,
          # so an unset secret would have left `brew install` serving the
          # previous release indefinitely while the run still reported success.
          # A distribution channel that did not update is a failed release, not
          # a warning — and the failure has to be visible in the run that caused
          # it, not discovered later by a user installing a stale build.
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so the Homebrew tap cannot be updated." >&2
            echo "Set the secret, or re-run this job once it is configured; the tap will" >&2
            echo "otherwise keep serving the previous release indefinitely." >&2
            exit 1
          fi
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"

          # Prebuilt-binary formula: it points at the same release archives every
          # other channel serves, with the hashes read from the release's own
          # sha256sums.txt rather than recomputed. Homebrew used to compile poly
          # from source here, which meant a full cargo build of ruff + oxc +
          # biome + mago + tree-sitter for anyone the tap's bottler did not
          # cover — and its runner matrix has no Intel macOS, so those users
          # compiled on every install. The tap's auto-bottle.yml skips formulae
          # that declare no source build, so this needs nothing on the tap side.
          GH_TOKEN="$GITHUB_TOKEN" gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sha256sums.txt' --dir sums --clobber
          mise run release:homebrew-formula "$version" sums/sha256sums.txt "$GITHUB_REPOSITORY" > poly.rb

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/homebrew-tap.git" tap
          cp poly.rb tap/Formula/poly.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/poly.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "poly ${version}"
            git push
          fi

  publish_scoop:
    name: Update Scoop bucket
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    # Non-blocking: the bucket lives in another repository and its push needs a
    # PAT this workflow does not control. A missing or under-scoped token is a
    # channel that did not update — worth a red job — but it must not fail the
    # release run, which by this point has already published the GitHub release
    # every other channel is served from. Nothing depends on this job, so its
    # failure cannot re-draft the release.
    continue-on-error: true
    permissions:
      # Reads the release's sha256sums.txt; the bucket push uses a PAT, not this
      # token, so the job never needs write access to this repository.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1

      - name: Update the bucket manifest
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same PAT the Homebrew tap step uses; its access covers
          # Goldziher/scoop-bucket as well, so there is one credential and one
          # pattern in this workflow rather than two.
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"

          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TOKEN is not set, so Goldziher/scoop-bucket cannot be updated." >&2
            echo "The bucket will otherwise keep serving the previous release indefinitely." >&2
            exit 1
          fi

          # The hash comes from the release's own sha256sums.txt. Recomputing it
          # from a locally downloaded copy would normally agree, but it is the one
          # place the bucket and the published archive could come to disagree.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'sha256sums.txt' --dir sums --clobber

          git clone --depth 1 "https://x-access-token:${HOMEBREW_TOKEN}@github.com/Goldziher/scoop-bucket.git" bucket
          mise run release:scoop-manifest "$version" sums/sha256sums.txt bucket/bucket/poly.json "$GITHUB_REPOSITORY" > poly.json
          cp poly.json bucket/bucket/poly.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/poly.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "poly ${version}"
            git push
          fi

  publish_npm:
    name: Publish npm (@goldziher/polylint)
    needs: [meta, finalize_release]
    # Registry payloads must match the finalized release binaries before any skip or upload. ~keep
    if: >-
      !inputs.plugins-only && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm trusted publishing exchanges for a publish
      # credential. No NODE_AUTH_TOKEN is set anywhere in this job.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - &registry-controller
        name: Load immutable controller publication guard
        env:
          CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --no-write-fetch-head origin "$CONTROLLER_SHA"
          controller="$(mktemp -d "$RUNNER_TEMP/poly-registry-controller.XXXXXX")"
          # The guard must come from the workflow's own commit, not from the ref under release, so it
          # is extracted rather than run through `mise run` against the checked-out tree. These are
          # the files of the verify:registry-payload task.
          for helper in registry-payload.py registry_archive.py; do
            git show "$CONTROLLER_SHA:mise-tasks/verify/$helper" > "$controller/$helper"
            test -s "$controller/$helper"
          done
          echo "POLY_REGISTRY_GUARD=$controller/registry-payload.py" >> "$GITHUB_ENV"

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          # Fetch what is attached to the release rather than rebuilding, so the
          # binaries inside the pnpm packages are byte-identical to the archives
          # sha256sums.txt describes. A separate build would drift silently.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          # sha256sums.txt was generated from `find .`, so its paths carry a ./
          # prefix that `sha256sum -c` resolves relative to this directory.
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Stage the release binaries into the platform packages
        run: ./npm-package/stage-binaries.sh --artifacts artifacts

      - name: Publish to npm
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          # A real release claims `latest`. The 0.0.0 bootstrap publish sits under
          # a `placeholder` dist-tag precisely so it never becomes what
          # `pnpm add @goldziher/polylint` resolves to; nothing here should
          # carry that tag forward.
          case "$version" in
            *-rc.* | *-beta* | *-alpha*) npm_tag="next" ;;
            *) npm_tag="latest" ;;
          esac

          publish_one() {
            local dir="$1"
            local name
            name="$(jq -r '.name' "$dir/package.json")"
            local pack_dir archive verdict
            pack_dir="$(mktemp -d)"
            ( cd "$dir" && pnpm pack --json --pack-destination "$pack_dir" ) > "$pack_dir/pack.json"
            archive="$(jq -r '.filename' "$pack_dir/pack.json")"
            case "$archive" in /*) ;; *) archive="$pack_dir/$archive" ;; esac
            verdict="$(python3 "$POLY_REGISTRY_GUARD" npm "$archive")"
            if [ "$verdict" = "exists=true" ]; then
              echo "· ${name}@${version} has the identical payload; skipping"
              return 0
            fi
            [ "$verdict" = "exists=false" ] || { echo "Invalid parity verdict" >&2; exit 1; }
            echo "→ publishing ${name}@${version} (--tag ${npm_tag})"
            # --provenance attaches a signed build-provenance attestation using
            # the job's id-token.
            ( cd "$dir" && pnpm publish "$archive" --no-git-checks --provenance --access public --tag "$npm_tag" )
          }

          # Platform packages first, and `set -e` means a failed one aborts the
          # step before the umbrella is published. That ordering is what keeps a
          # partial failure from producing the worst outcome: an umbrella package
          # on `latest` whose pinned binaries do not exist, which installs
          # cleanly and then has no `poly` to run.
          platforms=(npm-package/platforms/*/)
          expected="$(jq -er '.optionalDependencies | length | select(. > 0)' npm-package/package.json)"
          [ "${#platforms[@]}" -eq "$expected" ] || { echo "Incomplete npm platform inventory" >&2; exit 1; }
          for dir in "${platforms[@]}"; do
            publish_one "${dir%/}"
          done
          publish_one npm-package

  publish_plugin_npm:
    name: Publish npm agent plugin (OpenCode and Pi)
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}

      - *registry-controller

      - name: Install reviewed ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1

      - name: Setup Node.js and pnpm
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: node pnpm

      - name: Verify generated product bundles and public skills
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          ai-rulez verify --plugin
          mise run plugin:sync-skills --check
          mise run plugin:sync-version --check

      - name: Verify packed Pi and OpenCode resources
        run: |
          set -euo pipefail
          pnpm --dir plugin pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/plugin-pack.json"
          node - "$RUNNER_TEMP/plugin-pack.json" <<'JS'
          const fs = require('node:fs');
          const files = JSON.parse(fs.readFileSync(process.argv[2])).files.map((file) => file.path);
          const skills = files.filter((file) => /^\.pi\/skills\/[^/]+\/SKILL\.md$/.test(file));
          const prompts = files.filter((file) => /^\.pi\/prompts\/[^/]+\.md$/.test(file));
          if (skills.length !== 5 || prompts.length !== 2 || !files.includes('.opencode/plugins/poly.js')) {
            throw new Error(`Incomplete plugin: ${skills.length} skills, ${prompts.length} prompts`);
          }
          console.log(`Packed ${skills.length} Pi skills, ${prompts.length} prompts, and the OpenCode adapter`);
          JS

      - name: Verify exact packaged Pi and OpenCode resource bytes
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          case "$archive" in /*) ;; *) archive="$RUNNER_TEMP/$archive" ;; esac
          mise run verify:plugin-distribution npm "$archive"

      - name: Check the exact npm plugin payload
        id: npm-version
        run: |
          archive="$(jq -r '.filename' "$RUNNER_TEMP/plugin-pack.json")"
          case "$archive" in /*) ;; *) archive="$RUNNER_TEMP/$archive" ;; esac
          python3 "$POLY_REGISTRY_GUARD" npm "$archive" >> "$GITHUB_OUTPUT"
      - name: Publish verified agent package
        if: steps.npm-version.outputs.exists != 'true'
        uses: xberg-io/actions/publish-npm@v1
        with:
          expected-version: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
          package-dir: plugin
          access: public
          npm-tag: ${{ contains(needs.plugin-meta.outputs.version || needs.meta.outputs.version, '-') && 'next' || 'latest' }}
          provenance: "true"

  publish_plugin_artifacts:
    name: Publish all agent runtime archives and marketplaces
    needs: [meta, finalize_release]
    # Keyed on meta, not on finalize_release: a dispatch that re-runs an already
    # finalized release leaves finalize_release skipped, which used to skip the archives
    # job and make the verifier reject an otherwise complete release. Uploads are
    # idempotent, so running it again is safe.
    if: >-
      always() && !inputs.plugins-only && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Setup mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python
      - name: Verify public skill exports
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run plugin:sync-skills --check
      - name: Package all supported plugin runtimes
        uses: xberg-io/actions/package-ai-rulez-plugin@v1
        with:
          cursor-marketplace: "true"
          tag: ${{ needs.meta.outputs.tag }}
          config-directory: .ai-rulez
          version-sync-script: mise-tasks/plugin/sync-version.py
      - name: Archive verified runtime bundles and marketplace indexes
        shell: bash
        env:
          PLUGIN_TAG: ${{ needs.meta.outputs.tag }}
          PLUGIN_PRODUCT: poly
        run: |
          set -euo pipefail
          test -n "$PLUGIN_TAG"
          bundle="dist/${PLUGIN_PRODUCT}-plugins-${PLUGIN_TAG//\//-}.tar.gz"
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist/plugin . | gzip -n > "$bundle"
          (cd dist && sha256sum "$(basename "$bundle")") > "$bundle.sha256"
      - name: Attach verified plugin archive and metadata
        uses: xberg-io/actions/upload-release-assets@v1
        with:
          tag: ${{ needs.meta.outputs.tag }}
          assets: |
            dist/*-plugins-*.tar.gz
            dist/*-plugins-*.tar.gz.sha256

  publish_plugin_hermes:
    name: Publish Hermes plugin to PyPI
    needs: [plugin-meta, meta, finalize_release]
    if: >-
      always() && ((inputs.plugins-only && needs.plugin-meta.result == 'success')
      || (!inputs.plugins-only && needs.finalize_release.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugins-only && github.sha || needs.meta.outputs.tag }}
          fetch-depth: 0
      - *registry-controller

      - name: Install ai-rulez
        uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Setup Python and uv
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python uv
      - name: Verify plugin versions and generated resources before publishing
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          VERSION: ${{ needs.plugin-meta.outputs.version || needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mise run plugin:sync-version --expect "$VERSION"
          mise run plugin:sync-skills --check
          ai-rulez verify --plugin
      - name: Read the verified Hermes package version
        id: wheel-version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('plugin/.hermes/package/pyproject.toml').read_text())['project']
          if project['name'] != 'poly-hermes-plugin' or not project['version']:
              raise SystemExit('Missing or unexpected Hermes package identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={project['version']}\n")
          PY
      - name: Build Hermes wheel
        run: uv build --wheel --out-dir dist-hermes plugin/.hermes/package
      - name: Verify every packaged Hermes runtime resource
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run verify:plugin-distribution wheel dist-hermes/*.whl
      - name: Verify immutable Hermes registry payloads
        run: python3 "$POLY_REGISTRY_GUARD" wheel --expected-count 1 dist-hermes/*.whl
      - name: Publish verified Hermes wheel
        uses: xberg-io/actions/publish-pypi@v1
        with:
          expected-version: ${{ steps.wheel-version.outputs.version }}
          packages-dir: dist-hermes

  publish_pypi:
    name: Publish PyPI (polylint)
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for this project names this environment; the two
    # must agree or the OIDC exchange is refused.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - *registry-controller

      - name: Setup Python
        uses: xberg-io/actions/setup-mise@v1
        with:
          # A dispatched tag can predate mise.toml; restore the config from the workflow's commit. ~keep
          config-ref: ${{ github.sha }}
          tools: python

      - name: Download the published release archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.meta.outputs.tag }}"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'poly-*' --pattern 'sha256sums.txt' --dir artifacts --clobber
          ls -l artifacts

      - name: Verify the archives against the release checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c sha256sums.txt
          echo "✓ every downloaded archive matches the release checksums"

      - name: Build the platform wheels
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build hatchling
          python pip-package/build_wheels.py --artifacts artifacts --out pip-package/dist
          ls -l pip-package/dist

      - name: Verify immutable native PyPI registry payloads
        run: python3 "$POLY_REGISTRY_GUARD" wheel --expected-count 7 pip-package/dist/*.whl

      - name: Publish to PyPI
        # Trusted publishing (OIDC) — no API token. skip-existing keeps a re-run
        # of a partially uploaded release from failing on the files that landed.
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: pip-package/dist
          skip-existing: true

  update_major_tag:
    name: Move the major version tag
    needs: [meta, finalize_release]
    if: >-
      !inputs.plugins-only && (needs.finalize_release.result == 'success' && !contains(needs.meta.outputs.version, '-rc') && !contains(needs.meta.outputs.version, '-beta') && !contains(needs.meta.outputs.version, '-alpha'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

      - name: Move major tag to this release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          tag="${{ needs.meta.outputs.tag }}"
          major="v${version%%.*}"
          sha="$(git rev-list -n1 "$tag")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$sha"
          git push -f origin "refs/tags/${major}"
          echo "Moved ${major} → ${tag} (${sha})"

  plugin_release_report:
    name: Verify requested plugin distribution jobs succeeded
    needs: [publish_plugin_artifacts, publish_plugin_npm, publish_plugin_hermes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject incomplete plugin distribution
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          PLUGINS_ONLY: ${{ inputs.plugins-only }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS_JSON'])
          expected = {'publish_plugin_artifacts', 'publish_plugin_npm', 'publish_plugin_hermes'}
          if set(results) != expected:
              raise SystemExit('Expected exactly three plugin distribution jobs')
          for name, job in results.items():
              wanted = 'skipped' if name == 'publish_plugin_artifacts' and os.environ['PLUGINS_ONLY'] == 'true' else 'success'
              if job['result'] != wanted:
                  raise SystemExit(f"Incomplete plugin distribution: {name}={job['result']}, expected {wanted}")
          print('Verified all three requested plugin job outcomes')
          PY
