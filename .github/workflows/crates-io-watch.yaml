name: crates-io-watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
      - name: Check blocked crates
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run crates-io:watch
