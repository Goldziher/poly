name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  toolchain:
    name: toolchain baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # components/ is excluded from the root workspace, so `--all` above never reaches it.
      - run: cargo fmt --manifest-path components/Cargo.toml --all --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            components
      - run: cargo clippy --workspace --exclude conformance --all-targets -- -D warnings
      - uses: xberg-io/actions/setup-mise@v1
      - name: clippy (components workspace)
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check clippy
      # Linux only: rustdoc output does not vary by host, and the hook runs the same task.
      - name: rustdoc lint (components workspace)
        if: runner.os == 'Linux'
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run hooks:components-check rustdoc

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Integration binaries link the full engine registry; line tables exhaust the Linux runner disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            components
        # --no-fail-fast is not optional: cargo stops at the first failing test
        # binary, so a run with failures in three crates reports only the first
        # and the rest are rediscovered one CI round at a time.
      - name: Setup managed Python for native CMD regressions
        if: runner.os == 'Windows'
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python
      - name: Select native Python and require eight CMD regression tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          printf 'POLY_TEST_PYTHON=%s\n' "$(mise which python)" >> "$GITHUB_ENV"
          cargo test -p poly-hooks windows_cmd_transport -- --list > cmd-transport-tests.txt
          count="$(awk '
            /^runner::exec::shell::windows_tests::windows_cmd_transport_.*: test$/ {n++}
            END {print n+0}
          ' cmd-transport-tests.txt)"
          echo "Native CMD regression tests collected: $count/8"
          test "$count" -eq 8
      - run: cargo test --workspace --exclude conformance --no-fail-fast
      - name: test (components workspace)
        run: cargo test --locked --manifest-path components/Cargo.toml --workspace --no-fail-fast

  dogfood:
    # poly is a linter, and the repository is a real polyglot tree — Rust, TOML,
    # Markdown, YAML, JSON, shell. Running the binary against its own repo is the
    # only job here that exercises discovery, the engine registry and the report
    # path end to end on real files; the unit suite drives them on fixtures.
    #
    # Windows is in the matrix deliberately: path handling, line endings and the
    # ignore walk are where a cross-platform linter actually breaks, and none of
    # that is reachable from a test that never touches a real tree.
    name: dogfood / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Shorten paths for the biome checkout (adrs/0003-dependency-policy.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: components
      # The core binary cannot lint TOML, Markdown, JSON, YAML, JS/TS or CSS without the downloadable
      # component, so dogfooding runs the bundled binary built from components/.
      # --workspace never skips the whole-project phase: `cargo clippy` over this
      # repo is already its own job above, and running it twice buys nothing.
      - name: poly lint (self)
        run: cargo run --locked --manifest-path components/Cargo.toml -p poly-bundled --bin poly -- lint --workspace never .
      - name: poly fmt (self)
        run: cargo run --locked --manifest-path components/Cargo.toml -p poly-bundled --bin poly -- fmt .

  component-parity:
    # The sql family is left out of poly-core and served by the sql component built from this
    # tree; its lint and format output must equal the in-process snapshots byte for byte, and a
    # component whose hash does not match its lock must fail the run.
    name: component parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - name: Build the sql and astgrep components and write the dev lock
        run: mise run components:dev sql astgrep
      - name: Test poly-core in components mode
        run: mise run components:parity
      # A core build serves `poly rules` from the astgrep component; these only build without the
      # ast-grep engine family linked, so the workspace test run never reaches them.
      - name: poly rules from the astgrep component (core build)
        env:
          POLY_COMPONENT_DEV_LOCK: ${{ github.workspace }}/target/components/components.lock.json
        run: |
          cargo test --locked -p poly-cli --no-default-features --features dev-lock --test rules_core
          cargo test --locked -p poly-host-services --no-default-features --features dev-lock --test rules_component
      - name: poly rules without an embedded lock (core build)
        run: cargo test --locked -p poly-cli --no-default-features --features core --test rules_core

  go:
    # The Go sidecars under components/sidecars: vet, golangci-lint (govet, staticcheck, errcheck, gosec),
    # race tests, govulncheck, the licence allow-list and `go mod tidy -diff`, all through the mise task.
    name: go sidecars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: >-
            go golangci-lint
            go:golang.org/x/vuln/cmd/govulncheck
            go:github.com/google/go-licenses/v2
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('components/sidecars/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Vet, lint, test, vulnerabilities, licences, tidy
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sidecar:check

  sidecar-conformance:
    # The real sh sidecar, built and packaged as a release does, driven by the host through alef's stdio
    # transport and compared with the host shfmt byte for byte. POLY_REQUIRE_SIDECAR (set by the task)
    # fails the job if any of it was skipped.
    name: sidecar conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: go shfmt github:xberg-io/alef
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('components/sidecars/*/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Build, package and run the conformance tests
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sidecar:conformance

  alef-verify:
    # The checked-in alef outputs (producer crate, host module, versions) must match alef.toml.
    name: alef verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
      - name: alef verify
        run: mise x -- alef verify

  core-no-oxc:
    name: core links no oxc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - run: mise run check:core-no-oxc
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - name: the released core flavour builds warning-free
        run: cargo clippy --locked -p poly-cli --no-default-features --features core -- -D warnings
      - name: no git dependencies in the root workspace
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run check:deps

  # The released core ships on every download, so its size is gated on the largest native triple
  # (ADR 0039, ADR 0043): a fat-LTO `--profile core` build must stay under 14 MiB.
  core-size:
    name: core under 14 MiB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: xberg-io/actions/setup-mise@v1
      - run: mise run check:core-size
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # The release builds linux gnu components in this container through `mise run components:release`, with a
  # musl mise and alef the host fetched; the plan step runs the same path without compiling, so a broken
  # container invocation fails here rather than in a release. Keep the image in step with publish.yaml.
  component-release-container:
    name: component release (manylinux plan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: x86_64-unknown-linux-gnu
      RUST_TOOLCHAIN: "1.99.1"
      BUILD_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
      - name: Fetch alef and mise for the container
        shell: bash
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          mkdir -p target/components-release
          echo '{}' > target/components-release/previous-lock.json
          alef="$(mise run components:release fetch-alef)"
          mise_bin="$(mise run components:release fetch-mise)"
          jq_bin="$(mise run components:release fetch-jq)"
          {
            echo "ALEF_IN_CONTAINER=/work/${alef#"$PWD"/}"
            echo "MISE_IN_CONTAINER=/work/${mise_bin#"$PWD"/}"
            echo "JQ_IN_CONTAINER=/work/${jq_bin#"$PWD"/}"
          } >> "$GITHUB_ENV"
      - name: Plan components in the container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/work -w /work \
            -e TARGET -e RUST_TOOLCHAIN -e BUILD_IMAGE -e ALEF="$ALEF_IN_CONTAINER" \
            -e MISE_IN_CONTAINER -e JQ_IN_CONTAINER -e MISE_TASK_RUN_AUTO_INSTALL=false -e MISE_AUTO_INSTALL=false -e MISE_YES=1 \
            -e MISE_TRUSTED_CONFIG_PATHS=/work \
            -e CARGO_HOME=/work/target/components-release/toolchain/cargo \
            -e RUSTUP_HOME=/work/target/components-release/toolchain/rustup \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              git config --global --add safe.directory /work
              curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --target "$TARGET"
              export PATH="$CARGO_HOME/bin:$(dirname "$MISE_IN_CONTAINER"):$(dirname "$JQ_IN_CONTAINER"):$PATH"
              mise run components:release plan "$TARGET"
            '
          rows="$(jq '[.rows[] | select(.action == "build")] | length' "target/components-release/$TARGET/plan/plan.json")"
          echo "planned builds: $rows"
          [[ "$rows" -gt 0 ]]

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-deny (components workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: components/Cargo.toml
          arguments: --all-features --config components/deny.toml
