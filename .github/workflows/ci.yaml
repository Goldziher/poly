name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, for the hardening harness only.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      corpus:
        description: "Hardening corpus: b (pinned OSS) or c (generated code)"
        default: "b"
        type: string
      tier:
        description: "core or extended"
        default: "core"
        type: string
      roots:
        description: "Space-separated subset; empty runs the whole tier"
        default: ""
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude conformance --all-targets -- -D warnings

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # --no-fail-fast is not optional: cargo stops at the first failing test
        # binary, so a run with failures in three crates reports only the first
        # and the rest are rediscovered one CI round at a time.
      - run: cargo test --workspace --exclude conformance --no-fail-fast

  dogfood:
    # poly is a linter, and the repository is a real polyglot tree — Rust, TOML,
    # Markdown, YAML, JSON, shell. Running the binary against its own repo is the
    # only job here that exercises discovery, the engine registry and the report
    # path end to end on real files; the unit suite drives them on fixtures.
    #
    # Windows is in the matrix deliberately: path handling, line endings and the
    # ignore walk are where a cross-platform linter actually breaks, and none of
    # that is reachable from a test that never touches a real tree.
    name: dogfood / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-workspace skips the whole-project phase: `cargo clippy` over this
      # repo is already its own job above, and running it twice buys nothing.
      - name: poly lint (self)
        run: cargo run --locked -p poly-cli -- lint --no-workspace .
      - name: poly fmt --check (self)
        run: cargo run --locked -p poly-cli -- fmt --check .

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  hardening:
    # Real third-party trees, not poly's own fixtures. Not on the PR path: it
    # clones ~5 repositories and its per-rule counts feed a
    # ship-this-rule-on-by-default decision rather than a per-commit verdict.
    # `dogfood` above already covers "poly survives a real tree" on every PR.
    #
    # Corpus A is local-only — those trees are not on a runner and some are
    # private — so the harness refuses it here.
    name: hardening harness (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/share/swift "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      # Native toolchains stay off. rustfmt/gofmt/shellcheck are default-on when
      # present, so leaving them enabled would make the result depend on the
      # runner image rather than on poly.
      - name: run harden.sh
        env:
          POLY_HARDEN_CORPUS: ${{ inputs.corpus || 'b' }}
          POLY_HARDEN_TIER: ${{ inputs.tier || 'core' }}
        run: ./scripts/harden.sh ${{ inputs.roots }}

      # `if: always()` is what makes a red run diagnosable — without it the
      # failing run is the one with no data.
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harden-results
          path: /tmp/poly-harden/results.ndjson
          retention-days: 30
