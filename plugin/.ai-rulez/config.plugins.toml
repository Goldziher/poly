[plugin]
name = "poly"
version = "0.34.0"
opencode_dependency_enabled = false
include = ["assets/**"]
display_name = "polylint"
description = "polylint: one linter and formatter for every language in the repository, driven by poly.toml. Runs ruff, oxc, biome and more as signed components fetched on demand, host tools such as rustfmt and gofmt when present, and a tree-sitter tier for everything else. Exposes lint/format/cache tools over MCP with structured JSON output."
homepage = "https://github.com/Goldziher/polylint"
repository = "https://github.com/Goldziher/polylint"
license = "MIT"
category = "developer-tools"
keywords = ["linter", "formatter", "mcp", "code-quality", "rust"]
tags = ["mcp", "linter", "formatter", "tree-sitter", "git-hooks", "ci"]

runtimes = [
  "claude",
  "cursor",
  "codex",
  "gemini",
  "kimi",
  "opencode",
  "factory",
  "hermes",
  "pi",
  "agent-plugins",
  "copilot",
]

[plugin.author]
name = "Na'aman Hirschfeld"
email = "nhirschfeld@gmail.com"
url = "https://github.com/Goldziher"

[plugin.interface]
display_name = "polylint"
short_description = "One linter and formatter for every language, over MCP"
long_description = "polylint (the poly command) lints and formats a whole repository from one poly.toml. Its engines (ruff, oxc, biome, mago, sqruff, …) ship as signed components a core build downloads on first use; host tools such as rustfmt, gofmt and shellcheck run when installed; ecosystem tools run as opt-in recipes; a tree-sitter tier covers the rest. Its MCP server exposes lint/format/cache tools with structured JSON output."
developer_name = "Na'aman Hirschfeld"
category = "Developer Tools"
capabilities = ["Read", "Write"]
default_prompt = [
  "Lint this repository with poly and summarize the findings.",
  "Check formatting drift with poly and list the affected files.",
  "Apply poly's lint and format autofixes, then report what remains.",
  "Show poly's effective configuration for this repo.",
]
website_url = "https://github.com/Goldziher/polylint"
brand_color = "#F97316"


[[plugin.mcp]]
name = "poly"
command = "poly"
args = ["mcp"]

[plugin.codex]
manifest = "both"
marketplace = true

[plugin.cursor]
marketplace = true

[plugin.gemini]
commands = true
context_file_name = "assets/GEMINI.md"

[plugin.pi]
package_json = "merge"
package_name = "@goldziher/opencode-poly"

[plugin.hermes]
dependencies = ["mcp==2.3.0", "PyYAML==6.0.3"]
