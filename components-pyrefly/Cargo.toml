# The pyrefly engine family, in a cargo workspace of its own. pyrefly is a git dependency, and its
# library crate pulls tikv-jemallocator 0.7 unconditionally, while rumdl (in components/) links 0.6.1;
# Cargo allows one `links = "jemalloc"` crate per lockfile, so the two cannot share a workspace. alef builds
# the component from here (`source_manifest` / `producer_dir` in the root alef.toml).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.34.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
repository = "https://github.com/Goldziher/polylint"
homepage = "https://github.com/Goldziher/polylint"
documentation = "https://github.com/Goldziher/polylint"

[workspace.dependencies]
anyhow = "1"
insta = "1"
# pyrefly 1.4.1: one rev for every crate of the monorepo. `third-party-stubs` is off: it bundles ~36 MB of
# third-party type stubs that ty does not ship either; typeshed's stdlib is always bundled.
pyrefly = { git = "https://github.com/facebook/pyrefly", rev = "b726cd5f45eec1443e0f224dedd1dd45dcfb1a5d", default-features = false }
pyrefly_build = { git = "https://github.com/facebook/pyrefly", rev = "b726cd5f45eec1443e0f224dedd1dd45dcfb1a5d" }
pyrefly_config = { git = "https://github.com/facebook/pyrefly", rev = "b726cd5f45eec1443e0f224dedd1dd45dcfb1a5d" }
pyrefly_python = { git = "https://github.com/facebook/pyrefly", rev = "b726cd5f45eec1443e0f224dedd1dd45dcfb1a5d" }
pyrefly_util = { git = "https://github.com/facebook/pyrefly", rev = "b726cd5f45eec1443e0f224dedd1dd45dcfb1a5d" }
poly-component-host = { path = "../crates/poly-component-host" }
poly-component-index = { path = "../crates/poly-component-index" }
poly-component-protocol = { path = "../crates/poly-component-protocol" }
poly-engine-api = { path = "../crates/poly-engine-api" }
poly-engines = { path = "../crates/poly-engines", default-features = false }
poly-engines-pyrefly = { path = "crates/poly-engines-pyrefly" }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
