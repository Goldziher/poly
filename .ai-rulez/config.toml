version = "5.0"
name = "poly"
description = "Universal polyglot linter and formatter: one small binary and one poly.toml for every language, with engines downloaded on demand, host toolchains used where present, and built-in recipes for ecosystem linters."
gitignore = true
gitignore_exclude = [".pi/mcp.json"]

default_layers = ["plugins"]
presets = ["claude", "cursor", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi", "copilot"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]

[[mcp_servers]]
name = "poly"
description = "Lint, format, and cache over MCP."
command = "poly"
args = ["mcp"]

[[mcp_servers]]
name = "ai-rulez"
command = "ai-rulez"
args = ["mcp"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[codex]
project_doc_max_bytes = 131072

[lock]
include_outputs = false

[lint.load_budgets]
"codex-agents-chain" = 131072

[lint.severity]
AR601 = "info"
