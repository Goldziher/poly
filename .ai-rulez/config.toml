version = "4.0"
name = "poly"
description = "Universal zero-dependency linter & formatter — a single pure-Rust binary (poly) wrapping best-in-class tools as in-process backends, with a tree-sitter generic tier for everything else."
gitignore = true

presets = ["claude", "codex"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]

[plugin]
name = "poly"
version = "0.21.6"
display_name = "poly"
description = "Zero-dependency lint & format orchestrator over MCP — one pure-Rust binary wrapping ruff/oxc/taplo/rumdl and more as in-process backends, plus a tree-sitter generic tier for everything else. Exposes lint/format/cache tools with structured JSON output."
homepage = "https://github.com/Goldziher/poly"
repository = "https://github.com/Goldziher/poly"
license = "MIT"
category = "developer-tools"
keywords = ["linter", "formatter", "mcp", "code-quality", "rust"]
tags = ["mcp", "linter", "formatter", "tree-sitter", "git-hooks", "ci"]
content_root = "."

[plugin.author]
name = "Na'aman Hirschfeld"
email = "nhirschfeld@gmail.com"
url = "https://github.com/Goldziher"

[plugin.interface]
display_name = "poly"
short_description = "Zero-dependency lint & format orchestrator over MCP"
long_description = "poly is a single pure-Rust binary that lints and formats a whole repository across languages — wrapping ruff/oxc/taplo/rumdl and more as in-process backends, with a tree-sitter generic tier for everything else. Its MCP server exposes lint/format/cache tools with structured JSON output, no subprocesses and no system dependencies by default."
developer_name = "Na'aman Hirschfeld"
category = "Developer Tools"
capabilities = ["Interactive", "Read"]
default_prompt = [
    "Lint this repository with poly and summarize the findings.",
    "Check formatting drift with poly and list the affected files.",
    "Apply poly's lint and format autofixes, then report what remains.",
    "Show poly's effective configuration for this repo.",
]
website_url = "https://github.com/Goldziher/poly"
brand_color = "#F97316"


# The distributed plugin registers only poly's own server. ai-rulez is a
# repo-authoring tool, not something a poly consumer should have spawned for
# them, so it is intentionally not listed here (add it to a local, non-generated
# MCP config if you author rules in this repo).
[[mcp_servers]]
name = "poly"
description = "Lint, format, and cache over MCP — the poly binary's stdio server."
command = "poly"
args = ["mcp"]

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[marketplaces]]
name = "poly"
source = "Goldziher/poly"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

[[plugins]]
marketplace = "poly"
name = "poly"
scope = "project"
enabled = true
