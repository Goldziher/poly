version = "5.0"
name = "poly"
description = "Universal zero-dependency linter & formatter — a single pure-Rust binary (poly) wrapping best-in-class tools as in-process backends, with a tree-sitter generic tier for everything else."
gitignore = true

default_layers = ["plugins"]
presets = ["claude", "cursor", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi", "copilot"]

builtins = ["rust", "cicd", "documentation", "observability", "default-commands"]

[[mcp_servers]]
name = "poly"
description = "Lint, format, and cache over MCP."
command = "poly"
args = ["mcp"]

[[mcp_servers]]
name = "ai-rulez"
command = "ai-rulez"
args = ["mcp"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[codex]
project_doc_max_bytes = 131072

[lock]
include_outputs = false

[lint.load_budgets]
"codex-agents-chain" = 131072
